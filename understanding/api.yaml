          - name: 'channel: receipt.success'
            direction: server → client
            schema: {$ref: '#/components/schemas/SharedServerChannelFrame'}
            description: On the indicated authenticated subscription. Confirms a device receipt was stored. This confirmation has no delivery sequence.
            example:
