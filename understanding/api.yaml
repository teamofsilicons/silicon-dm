          - name: 'channel: resume.error'
            direction: server → client
            schema: {$ref: '#/components/schemas/SharedServerChannelFrame'}
            description: On the indicated authenticated subscription. Rejects this command; echoes its available identifiers. Correct the request before
              retrying; the socket stays open.
            example:
              type: channel
              data:
                subscription_id: alice-acme
                frame:
                  type: resume.error
                  data: {code: invalid_request, message: after_sequence is outside the available replay range, recoverable: true, member_id: alice@example.com,
                    after_sequence: 999}
          - name: 'channel: presence.error'
            direction: server → client
            schema: {$ref: '#/components/schemas/SharedServerChannelFrame'}
            description: On the indicated authenticated subscription. Rejects this command; echoes its available identifiers. Correct the request before
              retrying; the socket stays open.
            example:
              type: channel
              data:
                subscription_id: alice-acme
                frame:
                  type: presence.error
                  data: {code: forbidden, message: member is not authorized on this connection, recoverable: true, member_id: alice@example.com}
          - name: 'channel: receipt.error'
            direction: server → client
            schema: {$ref: '#/components/schemas/SharedServerChannelFrame'}
            description: On the indicated authenticated subscription. Rejects this command; echoes its available identifiers. Correct the request before
              retrying; the socket stays open.
            example:
              type: channel
              data:
                subscription_id: bob-acme
                frame:
                  type: receipt.error
                  data:
                    code: forbidden
                    message: device_id does not match this connection
                    recoverable: true
                    member_id: bob@example.com
                    conversation_id: alice@example.com::bob@example.com
                    message_id: 00a
                    device_id: different-device
          - name: 'channel: ping.error'
            direction: client → server
            schema: {$ref: '#/components/schemas/SharedClientChannelFrame'}
            description: On the indicated authenticated subscription. Client cannot complete the heartbeat. Does not count as a successful heartbeat; timeout
              may still close the connection.
            example:
              type: channel
              data:
                subscription_id: alice-acme
                frame:
                  type: ping.error
                  data: {ping_id: ping-1, code: heartbeat_failed, message: Unable to complete heartbeat., recoverable: false}
          - name: connection.error
            direction: server → client
            schema: {$ref: '#/components/schemas/SocketErrorFrame'}
            description: Outer transport error that cannot be assigned to a valid command or subscription.
            example:
              type: connection.error
              data: {code: invalid_frame, message: frame is not valid protocol JSON, recoverable: true}
          - name: 'ping.error: outer transport'
            direction: client → server
            schema: {$ref: '#/components/schemas/PingErrorFrame'}
            description: Client cannot complete the outer heartbeat. Does not satisfy the heartbeat deadline.
            example:
              type: ping.error
              data: {ping_id: outer-ping-1, code: heartbeat_failed, message: Unable to complete heartbeat., recoverable: false}
        closeCodes:
          - {code: 4000, reason: heartbeat-timeout}
      x-websocket-frame:
        anyOf:
          - {$ref: '#/components/schemas/SharedClientSocketFrame'}
          - {$ref: '#/components/schemas/SharedServerSocketFrame'}
  /api/v1/reports:
    post:
      tags: [Operations]
      operationId: submitBugReport
      summary: Durably submit a report and queue a Postmark notification
      description: Production retries notification delivery. Sandbox email is simulated. Reuse Idempotency-Key after an uncertain response. Ten new reports
        per member per hour.
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/TestingKey'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, data]
              properties:
                type: {type: string, const: report}
                data:
                  type: object
                  additionalProperties: false
                  required: [message, client_version]
                  properties:
                    message: {type: string, minLength: 1, maxLength: 60000}
                    pr:
                      type: [string, 'null']
                      format: uri
                    client_version: {type: string, maxLength: 100}
      responses:
        '202':
          description: Durable acknowledgement; notification is queued, sent or simulated
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {type: string, const: report}
                  data:
                    type: object
                    required: [id, submitted, notification, repository]
                    properties:
                      id: {type: string, format: uuid}
                      submitted: {type: boolean}
                      notification:
                        type: string
                        enum: [queued, sent, simulated]
                      repository: {type: string, format: uri}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/telemetry:
    post:
      tags: [Operations]
      operationId: recordDiagnostic
      summary: Record a bounded diagnostic event without distributing the ingest key
      description: X-DM-Telemetry off disables collection. Sandbox diagnostics remain in their own schema. Message content, URLs and secrets are excluded
        from the accepted schema.
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/TestingKey'}
        - in: header
          name: X-DM-Telemetry
          schema:
            type: string
            enum: ['on', 'off']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, data]
              properties:
                type: {type: string, const: telemetry}
                data:
                  type: object
                  additionalProperties: false
                  required: [source, event, success, duration_ms]
                  properties:
                    source:
                      type: string
                      enum: [cli, sdk, daemon, web]
                    event:
                      type: string
                      enum: [command, connection, callback, queue, update, page_view, request, web_error]
                    success: {type: boolean}
                    duration_ms: {type: integer, minimum: 0, maximum: 604800000}
      responses:
        '204': {description: Diagnostic accepted or opted out}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/iam:
    get:
      tags: [Auth]
      operationId: iamInformation
      summary: Discover the public IAM application configuration
      security: []
      description: Available before login. Returns only public identifiers and URLs, never application secrets.
      parameters:
        - {$ref: '#/components/parameters/TestingKey'}
      responses:
        '200':
          description: Public application configuration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [type, data]
                properties:
                  type: {type: string, const: iam}
                  data:
                    type: object
                    required: [app_id, iam_base_url, api_base_url]
                    properties:
                      app_id: {type: string}
                      iam_base_url: {type: string, format: uri}
                      api_base_url: {type: string, format: uri}
                      testing_environment_id:
                        type: [string, 'null']
                        format: uuid
                      testing_generation:
                        type: [integer, 'null']
                      testing_environment:
                        type: [object, 'null']
                        additionalProperties: true
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/ws:
    get:
      tags: [Realtime]
      operationId: openRealtimeConnection
      summary: Upgrade to the DM WebSocket protocol
      security:
        - bearerAuth: []
      description: 'Authenticate with a bearer token before upgrading. Repeat members for each represented account; org_id and device_id occur once.

        Example: /api/v1/ws?org_id=acme&members=alice%40example.com&device_id=laptop-browser-1.

        Members are the identities represented by the connection, not recipients or group members.

        Use members in connection queries and connection.ready frames, and member_id in member-scoped commands.

        After HTTP 101, send JSON text frames. connection.ready reports protocol_version=5. Durable events carry delivery metadata inside data.metadata
        for ACK/replay; only type and data appear at the root.

        Ping every 30 seconds requires ping.success with the same ping_id; 120 seconds without a valid ping.success closes the connection.

        ACK confirms processed deliveries, not message reading. Send receipt for delivered/read. Resume replays after a saved delivery sequence.

        See the WebSocket events catalogue in the local Swagger preview for exact frames in both directions.


        Commands use <command>, <command>.success and <command>.error. A response never needs another success response. channel is only an envelope. connection.ready,
        connection.prewarmed, subscription.closed and message.created/updated/deleted/delivered/read/failed are unsolicited notifications, not command replies.
        Only delivery events carrying data.metadata need delivery ACKs.'
      x-websocket-frame: {$ref: '#/components/schemas/SocketFrame'}
      parameters:
        - name: members
          in: query
          required: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            uniqueItems: true
            items: {type: string}
          style: form
          explode: true
          description: Repeat members once per represented IAM account ID; not conversation contacts. All must be authorized by this token. Current IAM
            integration grants only its authenticated principal; use separate shared subscriptions for independent accounts.
          examples:
            one_member:
              value: [alice@example.com]
            multiple_members:
              summary: Repeated query keys; requires a token authorized for every listed member.
              value: [alice@example.com, 'si:assistant']
        - name: org_id
          in: query
          required: true
          schema: {type: string}
          description: IAM-verified organization context for every represented member
          example: acme
        - name: device_id
          in: query
          required: true
          schema: {$ref: '#/components/schemas/DeviceId'}
          description: Stable client ID for delivery ACK/replay state; must also match receipt.device_id.
          example: laptop-browser-1
        - {$ref: '#/components/parameters/TestingKey'}
        - name: testing_generation
          in: query
          schema: {type: integer, minimum: 1}
          description: Generation persisted from ready.testing_generation. Missing/mismatched testing generation resets server cursor/resume to0; production
            does not use it.
      responses:
        '101': {description: Switching Protocols}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
      x-websocket:
        clientFrames: {$ref: '#/components/schemas/ClientSocketFrame'}
        serverFrames: {$ref: '#/components/schemas/ServerSocketFrame'}
        events:
          - name: ping.success
            direction: client → server
            schema: {$ref: '#/components/schemas/PongFrame'}
            description: Reply to the most recent application ping.
            example:
              type: ping.success
              data: {ping_id: ping-1}
          - name: ack
            direction: client → server
            schema: {$ref: '#/components/schemas/AckFrame'}
            description: Cumulative ACK after durably processing every delivery through this sequence; cannot ACK beyond what this connection emitted.
            example:
              type: ack
              data: {member_id: alice@example.com, through_sequence: 42}
          - name: resume
            direction: client → server
            schema: {$ref: '#/components/schemas/ResumeFrame'}
            description: Replay after the saved member-stream position; zero starts from the beginning. Not a conversation message ID.
            example:
              type: resume
              data: {member_id: alice@example.com, after_sequence: 41}
          - name: presence
            direction: client → server
            schema: {$ref: '#/components/schemas/PresenceFrame'}
            description: 'activity: typing, recording_voice, transcribing_voice, uploading_file, searching_gifs, or null to clear. No separate presence
              broadcast frame is currently emitted.'
            example:
              type: presence
              data: {member_id: alice@example.com, activity: typing}
          - name: receipt
            direction: client → server
            schema: {$ref: '#/components/schemas/ReceiptCommandFrame'}
            description: Send from the recipient’s connection. status is delivered or read; device_id must match that connection. read implies delivery.
            example:
              type: receipt
              data: {member_id: bob@example.com, conversation_id: 'alice@example.com::bob@example.com', message_id: 00a, status: read, device_id: bob-phone-1}
          - name: message.create
            direction: client → server
            schema: {$ref: '#/components/schemas/SendMessageFrame'}
            description: Message content is directly in data, not nested inside another message object. Reuse idempotency_key for retries.
            example:
              type: message.create
              data:
                member_id: alice@example.com
                org_id: acme
                conversation_id: alice@example.com::bob@example.com
                idempotency_key: send-alice-bob-001
                message: Can you review this?
                attachments: []
          - name: bundle
            direction: client → server
            schema: {$ref: '#/components/schemas/CreateBundleFrame'}
            description: Create a bundle atomically using the HTTP bundle rules. 1–100 unique existing messages from the same conversation, none already
              bundled; caller supplies display content. Reuse the idempotency key and identical content after timeout or reconnect. Same key and content
              returns the same bundle; changed content conflicts. No partial bundle or display message on failure.
            example:
              type: bundle
              data:
                member_id: si:assistant
                org_id: acme
                conversation_id: g:acme:engineering
                idempotency_key: bundle-engineering-001
                message_ids: ['001', '002', '003']
                display_message:
                  message: 'Summary: We agreed to ship on Friday.'
                  attachments: []
          - name: bundle.success
            direction: server → client
            schema: {$ref: '#/components/schemas/BundleCreatedFrame'}
            description: Durable creation confirmation, also returned for an identical retry. Correlate by member_id, conversation_id and idempotency_key.
              No delivery ACK for this frame; the display message is delivered separately as message.created with data.metadata.
            example:
              type: bundle.success
              data:
                id: '001'
                conversation_id: g:acme:engineering
                original_message_ids: ['001', '002', '003']
                display_message:
                  message-id: '004'
                  conversation_id: g:acme:engineering
                  recipient_id: g:acme:engineering
                  sender: {type: silicon, id: 'si:assistant'}
                  message: 'Summary: We agreed to ship on Friday.'
                  attachments: []
                  voice_transcript: null
                  reply: null
                  bundle: {id: '001', role: display}
                  created_at: '2026-09-17T10:00:00Z'
                  updated_at: null
                  deleted_at: null
                  delivered_at: null
                  read_at: null
                  history: []
                created_by: {type: silicon, id: 'si:assistant'}
                created_at: '2026-09-17T10:00:00Z'
                member_id: si:assistant
                idempotency_key: bundle-engineering-001
          - name: 'bundle.success: identical retry'
            direction: server → client
            schema: {$ref: '#/components/schemas/BundleCreatedFrame'}
            description: Resend the identical bundle request with the same idempotency_key. Returns the original bundle and display message IDs without
              creating duplicates.
            example:
              type: bundle.success
              data:
                id: '001'
                conversation_id: g:acme:engineering
                original_message_ids: ['001', '002', '003']
                display_message:
                  message-id: '004'
                  conversation_id: g:acme:engineering
                  recipient_id: g:acme:engineering
                  sender: {type: silicon, id: 'si:assistant'}
                  message: 'Summary: We agreed to ship on Friday.'
                  attachments: []
                  voice_transcript: null
                  reply: null
                  bundle: {id: '001', role: display}
                  created_at: '2026-09-17T10:00:00Z'
                  updated_at: null
                  deleted_at: null
                  delivered_at: null
                  read_at: null
                  history: []
                created_by: {type: silicon, id: 'si:assistant'}
                created_at: '2026-09-17T10:00:00Z'
                member_id: si:assistant
                idempotency_key: bundle-engineering-001
          - name: 'bundle.error: invalid input'
            direction: server → client
            schema: {$ref: '#/components/schemas/CommandErrorFrame'}
            description: Reject invalid content, duplicate IDs, or a count outside 1–100. No partial changes; socket remains open.
            example:
              type: bundle.error
              data:
                code: invalid_request
                message: bundle message_ids must be unique
                recoverable: true
                member_id: si:assistant
                conversation_id: g:acme:engineering
                idempotency_key: bundle-engineering-001
          - name: 'bundle.error: forbidden'
            direction: server → client
            schema: {$ref: '#/components/schemas/CommandErrorFrame'}
            description: Reject a Carbon creator, unauthorized member or organization, or missing conversation access. No partial changes; socket remains
              open.
            example:
              type: bundle.error
              data:
                code: forbidden
                message: only a Silicon with conversation access may create bundles
                recoverable: true
                member_id: si:assistant
                conversation_id: g:acme:engineering
                idempotency_key: bundle-engineering-001
          - name: 'bundle.error: conversation missing'
            direction: server → client
            schema: {$ref: '#/components/schemas/CommandErrorFrame'}
            description: The target conversation does not exist; no conversation is created by this command. No partial changes; socket remains open.
            example:
              type: bundle.error
              data: {code: not_found, message: conversation not found, recoverable: true, member_id: 'si:assistant', conversation_id: 'g:acme:engineering',
                idempotency_key: bundle-engineering-001}
          - name: 'bundle.error: messages unavailable'
            direction: server → client
            schema: {$ref: '#/components/schemas/CommandErrorFrame'}
            description: Reject missing messages, messages from another conversation, and messages already in any bundle, including display messages. No
              partial changes; socket remains open.
            example:
              type: bundle.error
              data:
                code: conflict
                message: one or more bundle messages are unavailable or already bundled
                recoverable: true
                member_id: si:assistant
                conversation_id: g:acme:engineering
                idempotency_key: bundle-engineering-001
          - name: 'bundle.error: idempotency conflict'
            direction: server → client
            schema: {$ref: '#/components/schemas/CommandErrorFrame'}
            description: Use a new key for a different operation; retry unchanged content with the original key after a lost confirmation. No partial changes;
              socket remains open.
            example:
              type: bundle.error
              data:
                code: conflict
                message: idempotency key was already used with different request content
                recoverable: true
                member_id: si:assistant
                conversation_id: g:acme:engineering
                idempotency_key: bundle-engineering-001
          - name: connection.ready
            direction: server → client
            schema: {$ref: '#/components/schemas/ReadyFrame'}
            description: Sent after authorization; gives the connection ID, authorized members, and stored delivery cursors. testing_generation is null
              in production.
            example:
              type: connection.ready
              data:
                protocol_version: 5
                testing_generation: null
                connection_id: 11111111-1111-4111-8111-111111111111
                members: [alice@example.com]
                acknowledged_through: {alice@example.com: 41}
          - name: ping
            direction: server → client
            schema: {$ref: '#/components/schemas/PingFrame'}
            description: Every 30 seconds; return ping.success with exactly the same ping_id.
            example:
              type: ping
              data: {ping_id: ping-1}
          - name: message.create.success
            direction: server → client
            schema: {$ref: '#/components/schemas/MessageAcceptedFrame'}
            description: Confirms this send is durable; delivery/read is tracked separately. No delivery ACK for this confirmation.
            example:
              type: message.create.success
              data:
                message-id: 00a
                conversation_id: alice@example.com::bob@example.com
                recipient_id: bob@example.com
                sender: {type: carbon, id: alice@example.com}
                message: Can you review this?
                attachments: []
                voice_transcript: null
                reply: null
                bundle: null
                created_at: '2026-09-17T10:00:00Z'
                updated_at: null
                deleted_at: null
                delivered_at: null
                read_at: null
                idempotency_key: send-alice-bob-001
                history: []
          - name: receipt.success
            direction: server → client
            schema: {$ref: '#/components/schemas/ReceiptRecordedFrame'}
            description: Confirms a device receipt was stored. This confirmation has no delivery sequence.
            example:
              type: receipt.success
              data: {message_id: 00a, conversation_id: 'alice@example.com::bob@example.com', status: read}
          - name: message.created
            direction: server → client
            schema: {$ref: '#/components/schemas/MessageDeliveryFrame'}
            description: Full current message snapshot with recipient delivery metadata in data.metadata. ACK this delivery sequence. recipient_id identifies
              the receiving account, including sender copies; replay can contain a newer snapshot.
            example:
              type: message.created
              data:
                message-id: 00a
                conversation_id: alice@example.com::bob@example.com
                recipient_id: bob@example.com
                sender: {type: carbon, id: alice@example.com}
                message: Can you review this?
                attachments: []
                voice_transcript: null
                reply: null
                bundle: null
                created_at: '2026-09-17T10:00:00Z'
                updated_at: null
                deleted_at: null
                delivered_at: null
                read_at: null
                metadata: {source: dm, delivery_id: 22222222-2222-4222-8222-000000000001, delivery_sequence: 42}
                history: []
          - name: message.updated
            direction: server → client
            schema: {$ref: '#/components/schemas/MessageDeliveryFrame'}
            description: Full current message snapshot with recipient delivery metadata in data.metadata. ACK this delivery sequence. recipient_id identifies
              the receiving account, including sender copies; replay can contain a newer snapshot.
            example:
              type: message.updated
              data:
                message-id: 00a
                conversation_id: alice@example.com::bob@example.com
                recipient_id: bob@example.com
                sender: {type: carbon, id: alice@example.com}
                message: Please review the updated design.
                attachments: []
                voice_transcript: null
                reply: null
                bundle: null
                created_at: '2026-09-17T10:00:00Z'
                updated_at: '2026-09-17T10:01:00Z'
                deleted_at: null
                delivered_at: null
                read_at: null
                metadata: {source: dm, delivery_id: 22222222-2222-4222-8222-000000000002, delivery_sequence: 43}
                history:
                  - message: Can you review this?
                    attachments: []
                    voice_transcript: null
                    reply: null
                    created_at: '2026-09-17T10:00:00Z'
          - name: message.deleted
            direction: server → client
            schema: {$ref: '#/components/schemas/MessageDeliveryFrame'}
            description: Full current message snapshot with recipient delivery metadata in data.metadata. ACK this delivery sequence. recipient_id identifies
              the receiving account, including sender copies; replay can contain a newer snapshot.
            example:
              type: message.deleted
              data:
                message-id: 00a
                conversation_id: alice@example.com::bob@example.com
                recipient_id: bob@example.com
                sender: {type: carbon, id: alice@example.com}
                message: null
                attachments: []
                voice_transcript: null
                reply: null
                bundle: null
                created_at: '2026-09-17T10:00:00Z'
                updated_at: null
                deleted_at: '2026-09-17T10:01:00Z'
                delivered_at: null
                read_at: null
                metadata: {source: dm, delivery_id: 22222222-2222-4222-8222-000000000003, delivery_sequence: 44}
                history: []
          - name: message.delivered
            direction: server → client
            schema: {$ref: '#/components/schemas/ReceiptDeliveryFrame'}
            description: Full current message snapshot with recipient delivery metadata in data.metadata. ACK this delivery sequence. recipient_id identifies
              the receiving account, including sender copies; replay can contain a newer snapshot.
            example:
              type: message.delivered
              data:
                message-id: 00a
                conversation_id: alice@example.com::bob@example.com
                recipient_id: bob@example.com
                sender: {type: carbon, id: alice@example.com}
                message: Can you review this?
                attachments: []
                voice_transcript: null
                reply: null
                bundle: null
                created_at: '2026-09-17T10:00:00Z'
                updated_at: null
                deleted_at: null
                delivered_at: '2026-09-17T10:00:02Z'
                read_at: null
                metadata: {source: dm, delivery_id: 22222222-2222-4222-8222-000000000004, delivery_sequence: 45}
                history: []
          - name: message.read
            direction: server → client
            schema: {$ref: '#/components/schemas/ReceiptDeliveryFrame'}
            description: Full current message snapshot with recipient delivery metadata in data.metadata. ACK this delivery sequence. recipient_id identifies
              the receiving account, including sender copies; replay can contain a newer snapshot.
            example:
              type: message.read
              data:
                message-id: 00a
                conversation_id: alice@example.com::bob@example.com
                recipient_id: bob@example.com
                sender: {type: carbon, id: alice@example.com}
                message: Can you review this?
                attachments: []
                voice_transcript: null
                reply: null
                bundle: null
                created_at: '2026-09-17T10:00:00Z'
                updated_at: null
                deleted_at: null
                delivered_at: '2026-09-17T10:00:02Z'
                read_at: '2026-09-17T10:01:00Z'
                metadata: {source: dm, delivery_id: 22222222-2222-4222-8222-000000000005, delivery_sequence: 46}
                history: []
          - name: message.failed
            direction: server → client
            schema: {$ref: '#/components/schemas/ReceiptDeliveryFrame'}
            description: Full current message snapshot with recipient delivery metadata in data.metadata. ACK this delivery sequence. recipient_id identifies
              the receiving account, including sender copies; replay can contain a newer snapshot.
            example:
              type: message.failed
              data:
                message-id: 00a
                conversation_id: alice@example.com::bob@example.com
                recipient_id: bob@example.com
                sender: {type: carbon, id: alice@example.com}
                message: Can you review this?
                attachments: []
                voice_transcript: null
                reply: null
                bundle: null
                created_at: '2026-09-17T10:00:00Z'
                updated_at: null
                deleted_at: null
                delivered_at: null
                read_at: null
                metadata: {source: dm, delivery_id: 22222222-2222-4222-8222-000000000006, delivery_sequence: 47}
                history: []
          - name: connection.error
            direction: server → client
            schema: {$ref: '#/components/schemas/SocketErrorFrame'}
            description: Malformed or unrecognized frame that cannot be assigned to a command. Recognized command failures use that command’s .error type.
            example:
              type: connection.error
              data: {code: invalid_frame, message: client frame is not valid protocol JSON, recoverable: true}
          - name: ack.success
            direction: server → client
            schema: {$ref: '#/components/schemas/AckSuccessFrame'}
            description: Confirms the durable cumulative ACK. through_sequence is the stored position, which never decreases. Do not ACK this confirmation.
            example:
              type: ack.success
              data: {member_id: alice@example.com, through_sequence: 42}
          - name: resume.success
            direction: server → client
            schema: {$ref: '#/components/schemas/ResumeSuccessFrame'}
            description: Confirms the replay request was accepted after after_sequence, not that replay has finished. Stored ACK is unchanged; ACK replayed
              delivery events normally.
            example:
              type: resume.success
              data: {member_id: alice@example.com, after_sequence: 41}
          - name: presence.success
            direction: server → client
            schema: {$ref: '#/components/schemas/PresenceSuccessFrame'}
            description: Confirms this member activity was stored. No delivery ACK or separate presence broadcast.
            example:
              type: presence.success
              data: {member_id: alice@example.com, activity: typing}
          - name: message.create.error
            direction: server → client
            schema: {$ref: '#/components/schemas/CommandErrorFrame'}
            description: Rejects this command; echoes its available identifiers. Correct the request before retrying; the socket stays open.
            example:
              type: message.create.error
              data:
                code: invalid_request
                message: Can you review this?
                recoverable: true
                member_id: alice@example.com
                conversation_id: alice@example.com::bob@example.com
                idempotency_key: send-alice-bob-001
          - name: ack.error
            direction: server → client
            schema: {$ref: '#/components/schemas/CommandErrorFrame'}
            description: Rejects this command; echoes its available identifiers. Correct the request before retrying; the socket stays open.
            example:
              type: ack.error
              data: {code: invalid_request, message: through_sequence exceeds the last emitted sequence, recoverable: true, member_id: alice@example.com,
                through_sequence: 999}
          - name: resume.error
            direction: server → client
            schema: {$ref: '#/components/schemas/CommandErrorFrame'}
            description: Rejects this command; echoes its available identifiers. Correct the request before retrying; the socket stays open.
            example:
              type: resume.error
              data: {code: invalid_request, message: after_sequence is outside the available replay range, recoverable: true, member_id: alice@example.com,
                after_sequence: 999}
          - name: presence.error
            direction: server → client
            schema: {$ref: '#/components/schemas/CommandErrorFrame'}
            description: Rejects this command; echoes its available identifiers. Correct the request before retrying; the socket stays open.
            example:
              type: presence.error
              data: {code: forbidden, message: member is not authorized on this connection, recoverable: true, member_id: alice@example.com}
          - name: receipt.error
            direction: server → client
            schema: {$ref: '#/components/schemas/CommandErrorFrame'}
            description: Rejects this command; echoes its available identifiers. Correct the request before retrying; the socket stays open.
            example:
              type: receipt.error
              data:
                code: forbidden
                message: device_id does not match this connection
                recoverable: true
                member_id: bob@example.com
                conversation_id: alice@example.com::bob@example.com
                message_id: 00a
                device_id: different-device
          - name: ping.error
            direction: client → server
            schema: {$ref: '#/components/schemas/PingErrorFrame'}
            description: Client cannot complete the heartbeat. Does not count as a successful heartbeat; timeout may still close the connection.
            example:
              type: ping.error
              data: {ping_id: ping-1, code: heartbeat_failed, message: Unable to complete heartbeat., recoverable: false}
        closeCodes:
          - {code: 4000, reason: heartbeat-timeout}
          - {code: 4001, reason: authorization-revoked}
          - {code: 1013, reason: authorization-unavailable}
          - {code: 1011, reason: internal-error}
          - {code: 1009, reason: frame-too-large}
          - {code: 1000, reason: Normal client closure; client-supplied valid close codes may also be echoed.}
