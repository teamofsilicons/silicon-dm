                    idempotency_key: bundle-engineering-001}
          - name: 'channel: bundle.error: messages unavailable'
            direction: server → client
            schema: {$ref: '#/components/schemas/SharedServerChannelFrame'}
            description: After subscribing assistant-work as si:assistant in acme. Reject missing messages, messages from another conversation, and messages
              already in any bundle, including display messages. No partial changes; socket remains open.
            example:
              type: channel
              data:
                subscription_id: assistant-work
                frame:
                  type: bundle.error
                  data:
                    code: conflict
