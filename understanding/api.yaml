                    recoverable: true
                    member_id: si:assistant
                    conversation_id: g:acme:engineering
                    idempotency_key: bundle-engineering-001
          - name: 'channel: bundle.error: forbidden'
            direction: server → client
            schema: {$ref: '#/components/schemas/SharedServerChannelFrame'}
            description: After subscribing assistant-work as si:assistant in acme. Reject a Carbon creator, unauthorized member or organization, or missing
              conversation access. No partial changes; socket remains open.
            example:
              type: channel
              data:
                subscription_id: assistant-work
                frame:
                  type: bundle.error
                  data:
                    code: forbidden
                    message: only a Silicon with conversation access may create bundles
                    recoverable: true
                    member_id: si:assistant
                    conversation_id: g:acme:engineering
                    idempotency_key: bundle-engineering-001
          - name: 'channel: bundle.error: conversation missing'
            direction: server → client
            schema: {$ref: '#/components/schemas/SharedServerChannelFrame'}
