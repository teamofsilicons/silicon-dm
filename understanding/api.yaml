        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
      description: Lifecycle authority uses a production IAM application session. The DM test key does not bypass production management authorization. Creator
        or current organization administrator required for changes/key access; any current member may create/list/read environments. Idempotency-Key is
        required. Exact request replays return the original result; changed body or target with the same key returns409. Responses use Cache-Control:no-store.
  /api/v1/testing-environments/{environment_id}/key:
    get:
      tags: [Testing]
      operationId: getTestingEnvironmentKey
      summary: Retrieve current test root key
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/EnvironmentId'}
      responses:
        '200':
          description: Retrieve current test root key
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [type, data]
                properties:
                  type: {type: string, const: testing_environment_key}
                  data: {$ref: '#/components/schemas/TestingEnvironmentKey'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
      description: Lifecycle authority uses a production IAM application session. The DM test key does not bypass production management authorization. Creator
        or current organization administrator required for changes/key access; any current member may create/list/read environments.
  /api/v1/testing-environments/{environment_id}/rotate-key:
    post:
      tags: [Testing]
      operationId: rotateTestingEnvironmentKey
      summary: Rotate root key and disconnect existing sessions
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/EnvironmentId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: Rotate root key and disconnect existing sessions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [type, data]
                properties:
                  type: {type: string, const: rotate_testing_environment_key}
                  data: {$ref: '#/components/schemas/TestingEnvironmentWithKey'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
      description: Lifecycle authority uses a production IAM application session. The DM test key does not bypass production management authorization. Creator
        or current organization administrator required for changes/key access; any current member may create/list/read environments. Idempotency-Key is
        required. Exact request replays return the original result; changed body or target with the same key returns409. Responses use Cache-Control:no-store.
  /api/v1/testing-environments/{environment_id}/restore:
    post:
      tags: [Testing]
      operationId: restoreTestingEnvironment
      summary: Recover retained data with a fresh root key
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/EnvironmentId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: Recover retained data with a fresh root key
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [type, data]
                properties:
                  type: {type: string, const: restore_testing_environment}
                  data: {$ref: '#/components/schemas/TestingEnvironmentWithKey'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
      description: Lifecycle authority uses a production IAM application session. The DM test key does not bypass production management authorization. Creator
        or current organization administrator required for changes/key access; any current member may create/list/read environments. Idempotency-Key is
        required. Exact request replays return the original result; changed body or target with the same key returns409. Responses use Cache-Control:no-store.
  /api/v1/testing-environments/{environment_id}/clean:
    post:
      tags: [Testing]
      operationId: cleanTestingEnvironment
      summary: Erase test data while retaining environment and key
      parameters:
        - name: X-Org-ID
          in: header
          required: false
          schema: {type: string}
          description: Required when using production bearer authorization; unnecessary with test root key.
        - {$ref: '#/components/parameters/EnvironmentId'}
        - {$ref: '#/components/parameters/TestingKey'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204': {description: Erase test data while retaining environment and key}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
      description: Authorize with this environment root key alone, or creator/admin production IAM session. The path ID and key must match. Removes all
        message, draft, delivery, receipt, presence and webhook-receipt rows; retains environment metadata/key. Other environments and production are unchanged.
        Idempotency-Key is required. Exact request replays return the original result; changed body or target with the same key returns409. Responses use
        Cache-Control:no-store.
      security:
        - bearerAuth: []
        - testingEnvironmentKey: []
  /webhook/:
    post:
      tags: [IAM webhooks]
      operationId: receiveIamWebhook
      summary: Receive signature-authenticated IAM events
      security: []
      description: Backend-to-backend IAM callback. Exactly one of each signature header is required. Official SDK verifies exact bytes, five-minute signing-time
        tolerance, key version, event identity and 1 MiB limit. Test envelopes are verified before matching the IAM key to an active DM test environment.
        Root keys and raw bodies are never persisted. Duplicate event IDs are safe. Successful receipt durably prompts connected token revalidation; IAM
        remains authoritative. A bounded redacted test-key hint selects candidates; exact SDK signature and environment binding are verified before initializing
        runtimes. One authenticated IAM test event invalidates all active DM environments paired to that IAM realm, including inherited/overridden signer
        versions. Invalid signatures cannot initialize a testing runtime.
      parameters:
        - name: X-Silicon-IAM-Event-ID
          in: header
          required: true
          schema: {type: string}
        - name: X-Silicon-IAM-Timestamp
          in: header
          required: true
          schema: {type: string}
        - name: X-Silicon-IAM-Key-Version
          in: header
          required: true
          schema: {type: string}
        - name: X-Silicon-IAM-Signature
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true, description: Exact IAM production event or signed testing envelope; see official IAM WebhookEvent
                contract.}
      responses:
        '204': {description: Verified event committed or duplicate acknowledged}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
  /live:
    get:
      tags: [Operations]
      operationId: live
      security: []
      summary: Process liveness
      responses:
        '204': {description: Ready}
        '503': {description: Dependency or migration unavailable}
  /ready:
    get:
      tags: [Operations]
      operationId: ready
      security: []
      summary: Database and migration readiness
      responses:
        '204': {description: Ready}
        '503': {description: Dependency or migration unavailable}
  /api/v1/messages:
    post:
      tags: [Messages]
      operationId: sendToRecipient
      summary: Send to an authorized recipient without a conversation ID
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/TestingKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, data]
              properties:
                type: {type: string, const: message.created}
                data: {$ref: '#/components/schemas/MessageCreate'}
      responses:
        '202':
          description: Message durably accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [type, data]
                properties:
                  type: {type: string, const: message.created}
                  data: {$ref: '#/components/schemas/Message'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    honeycombService: {type: http, scheme: bearer, description: 'Dedicated Honeycomb service credential, independent of test sessions.'}
    bearerAuth: {type: http, scheme: bearer, bearerFormat: IAM application access token (oat_)}
    testingEnvironmentKey:
      type: apiKey
      in: header
      name: X-Testing-Environment-Key
      description: 32-character DM testing root key. Selects an isolated data plane; normal actions still require its IAM user session.
  parameters:
    OrgId:
      name: X-Org-ID
      in: header
      required: true
      schema: {type: string}
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ConversationAddress'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 255, pattern: '^[!-~]{8,255}$'}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    TestingKey:
      name: X-Testing-Environment-Key
      in: header
      required: false
      schema: {type: string, pattern: '^(ask_[A-Za-z0-9_-]{43}|[A-Za-z0-9]{32})$'}
      description: IAM test app secret for automatic discovery, or a legacy DM root key. Omit for production. Never send the IAM environment root key.
    EnvironmentId:
      name: environment_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    MessageId:
      name: message_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/MessageReference'}
    MessageVersion:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"?[1-9][0-9]*"?$'}
      description: Exact observed positive message version, e.g. "1". PATCH replaces all message content. Missing/invalid versions are 422; a stale version
        is 409.
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [type, data]
            properties:
              type: {type: string, const: error}
              data: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Authentication credentials are missing or invalid
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [type, data]
            properties:
              type: {type: string, const: error}
              data: {$ref: '#/components/schemas/Error'}
  schemas:
    HoneycombOperation:
      type: object
      additionalProperties: false
      required: [operation_id, environment_id, org_id, app_id, environment_revision, generation, key_version, action, testing_key]
      properties:
        operation_id: {type: string, format: uuid}
        environment_id: {type: string, format: uuid}
        org_id: {type: string, minLength: 1, maxLength: 128}
        app_id: {type: string}
        environment_revision: {type: integer, minimum: 1}
        generation: {type: integer, minimum: 1}
        key_version: {type: integer, minimum: 1}
        action:
          type: string
          enum: [prepare, import, refresh-import, rotate-key, clean, disable, restore, purge, retire-applications]
        testing_key: {type: string, pattern: '^[A-Za-z0-9]{32}$', writeOnly: true}
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        description:
          type: [string, 'null']
          maxLength: 4096
        snapshot: {}
        reason: {type: string}
        retired_apps:
          type: array
          items: {type: string}
    HoneycombReceipt:
      type: object
      required: [operation_id, environment_id, app_id, environment_revision, generation, key_version, state, retired_apps]
      properties:
        operation_id: {type: string, format: uuid}
        environment_id: {type: string, format: uuid}
        app_id: {type: string}
        environment_revision: {type: integer, minimum: 1}
        generation: {type: integer, minimum: 1}
        key_version: {type: integer, minimum: 1}
        state:
          type: string
          enum: [pending, completed, failed]
        target_state: {type: string, description: 'Intended local state, present in pending and failed receipts.'}
        retired_apps:
          type: array
          items: {type: string}
    ConversationAddress:
      type: string
      description: Immutable direct address, ordered Carbon before Silicon then lexically, or g:org:group-slug. UUID aliases remain accepted. Conversation
        routes also accept an authorized recipient account, resolving or creating the direct chat on send. Scope all addresses by organization and testing
        environment.
      examples: ['saket::cos:tos', 'g:tos:team']
    GroupSettings:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 4000, default: ''}
        is_public: {type: boolean, default: false}
        tag_ids:
          type: array
          maxItems: 100
          items: {type: string, format: uuid}
          default: []
    GroupCreate:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 4000, default: ''}
        is_public: {type: boolean, default: false}
        tag_ids:
          type: array
          maxItems: 100
          items: {type: string, format: uuid}
          default: []
        member_ids:
          type: array
          maxItems: 100
          items: {type: string}
          default: []
    GroupDetails:
      type: object
      required: [name, description, is_public, tag_ids, version, invited_members]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 4000, default: ''}
        is_public: {type: boolean, default: false}
        tag_ids:
          type: array
          maxItems: 100
          items: {type: string, format: uuid}
          default: []
        version: {type: integer, minimum: 1}
        invited_members:
          type: array
          items: {$ref: '#/components/schemas/MemberRef'}
    GroupMembers:
      type: object
      additionalProperties: false
      required: [member_ids]
      properties:
        member_ids:
          type: array
          maxItems: 100
          items: {type: string}
          default: []
    MemberRef:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [carbon, silicon]
        id:
          type: string
          description: IAM account ID.
          examples: [alice@example.com, 'si:assistant']
    Conversation:
      type: object
      required: [id, org_id, participants, created_at, updated_at]
      properties:
        group: {$ref: '#/components/schemas/GroupDetails'}
        id: {$ref: '#/components/schemas/ConversationAddress'}
        org_id: {type: string}
        participants:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/MemberRef'}
        last_message:
          anyOf:
            - {$ref: '#/components/schemas/Message'}
            - {type: 'null'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Attachment:
      type: object
      required: [permanent_url]
      properties:
        permanent_url:
          type: string
          format: uri
          maxLength: 8192
          pattern: ^https://(?![^/?#]*@)[^/?#]+(?:[/?#]|$)
          description: Credential-free HTTPS link, at most 8192 bytes. DM stores this link without contacting its host. No upload, proxy, or temporary-URL
            endpoint exists.
        name: {type: string, minLength: 1, maxLength: 1024}
        content_type: {type: string, minLength: 1, maxLength: 255}
        size: {type: integer, minimum: 0, maximum: 5368709120, description: Untrusted client-declared byte size.}
    VoiceAttachment:
      allOf:
        - {$ref: '#/components/schemas/Attachment'}
        - type: object
          required: [duration_milliseconds]
          properties:
            duration_milliseconds: {type: integer, minimum: 1, maximum: 172800000, description: 'Untrusted caller-supplied total playback duration, capped
                at 48 hours.'}
    StoredVoiceAttachment:
      allOf:
        - {$ref: '#/components/schemas/Attachment'}
        - type: object
          required: [duration_milliseconds]
          properties:
            duration_milliseconds:
              type: [integer, 'null']
              minimum: 1
              maximum: 172800000
              description: Total playback duration. Null is returned only for a historical pre-v 2 voice row whose provider did not supply duration metadata.
    Gif:
      type: object
      required: [provider_id, url]
      properties:
        provider_id: {type: string, minLength: 1, maxLength: 255}
        url: {type: string, format: uri, maxLength: 8192, pattern: '^https://'}
        preview_url: {type: string, format: uri, maxLength: 8192, pattern: '^https://'}
        title: {type: string, maxLength: 1000}
    MessageCreate:
      type: object
      properties:
        message: {type: string, maxLength: 100000000, default: ''}
        attachments:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/AttachmentLink'}
        voice_transcript:
          type: [string, 'null']
          maxLength: 100000000
        reply:
          anyOf:
            - type: object
              required: [message-id]
              properties:
                message-id: {$ref: '#/components/schemas/MessageReference'}
            - {type: 'null'}
        recipient_id: {type: string, description: Required for POST /messages; otherwise the path supplies the destination.}
        sender_id: {type: string, description: Explicit represented sender when authorized.}
      anyOf:
        - required: [message]
          properties:
            message: {minLength: 1}
        - required: [attachments]
          properties:
            attachments: {minItems: 1}
      description: Text, attachments, or both. Audio goes in attachments with optional voice_transcript. Supply only the referenced message-id for a reply;
        sender and quoted content come from the server. Legacy UUID references and old attachment objects remain accepted on input.
    Message:
      type: object
      additionalProperties: false
      required: [message-id, conversation_id, recipient_id, sender, message, attachments, voice_transcript, reply, bundle, created_at, updated_at, deleted_at,
        delivered_at, read_at, history]
      properties:
        message-id: {$ref: '#/components/schemas/MessageCode'}
        conversation_id: {$ref: '#/components/schemas/ConversationAddress'}
        recipient_id: {type: string, description: 'History: the destination account or group. Callback: the receiving account, including the sender copy.'}
        sender: {$ref: '#/components/schemas/MemberRef'}
        message:
          type: [string, 'null']
          maxLength: 100000000
        attachments:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/AttachmentLink'}
        voice_transcript:
          type: [string, 'null']
          maxLength: 100000000
        reply:
          anyOf:
            - {$ref: '#/components/schemas/Reply'}
            - {type: 'null'}
        bundle:
          anyOf:
            - {$ref: '#/components/schemas/BundleRef'}
            - {type: 'null'}
        created_at: {type: string, format: date-time}
        updated_at:
          type: [string, 'null']
          format: date-time
        deleted_at:
          type: [string, 'null']
          format: date-time
        delivered_at:
          type: [string, 'null']
          format: date-time
        read_at:
          type: [string, 'null']
          format: date-time
        history:
          type: array
          items: {$ref: '#/components/schemas/MessageHistoryEntry'}
          description: Previous content, oldest first. Empty initially; deletion adds no history entry. Deleted responses hide content history.
      description: Fixed current snapshot. All fields are present. Text is empty for attachment-only sends, null for tombstones. Upsert by conversation_id,
        message-id and updated_at. Delivery records may hydrate the current edited or deleted snapshot on replay.
    BundleRef:
      type: object
      required: [id, role]
      properties:
        id: {$ref: '#/components/schemas/BundleCode'}
        role:
          type: string
          enum: [display, member]
    BundleCreate:
      type: object
      required: [message_ids, display_message]
      properties:
        message_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {$ref: '#/components/schemas/MessageReference'}
        display_message: {$ref: '#/components/schemas/MessageCreate'}
    Bundle:
      type: object
      required: [id, conversation_id, original_message_ids, display_message, created_by, created_at]
      properties:
        id: {$ref: '#/components/schemas/BundleCode'}
        conversation_id: {$ref: '#/components/schemas/ConversationAddress'}
        original_message_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/MessageReference'}
        display_message: {$ref: '#/components/schemas/Message'}
        created_by: {$ref: '#/components/schemas/MemberRef'}
        created_at: {type: string, format: date-time}
    BundleDetail:
      allOf:
        - {$ref: '#/components/schemas/Bundle'}
        - type: object
          required: [original_messages]
          properties:
            original_messages:
              type: array
              minItems: 1
              maxItems: 100
              items: {$ref: '#/components/schemas/Message'}
    DraftInput:
      type: object
      properties:
        message_content: {type: string, maxLength: 100000000}
        attachments:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Attachment'}
          description: Combined attachment and voice item count may not exceed 100.
        voice: {$ref: '#/components/schemas/VoiceAttachment', description: Counts toward the combined 100 attachment-item maximum.}
        voice_transcript:
          type: [string, 'null']
          maxLength: 100000000
          description: Optional synchronized client-supplied transcript; requires voice.
        gif: {$ref: '#/components/schemas/Gif'}
        metadata:
          type: object
          additionalProperties: true
          default: {}
          description: Arbitrary caller-owned JSON object, always returned. Nested JSON values are preserved. PATCH is full replacement; include the metadata
            to retain it.
        reply_to_message_id:
          anyOf:
            - {$ref: '#/components/schemas/MessageReference'}
            - {type: 'null'}
      allOf:
        - if:
            required: [voice_transcript]
            properties:
              voice_transcript: {type: string}
          then:
            required: [voice]
            properties:
              voice: {}
    Draft:
      type: object
      required: [conversation_id, member_id, version, updated_at, metadata]
      properties:
        conversation_id: {$ref: '#/components/schemas/ConversationAddress'}
        member_id: {type: string}
        version: {type: integer, minimum: 1, description: Monotonic token retained across draft deletion and automatic clearing. Gaps are allowed. Use this
            returned value for the next save.}
        message_content: {type: string, maxLength: 100000000}
        attachments:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Attachment'}
        voice: {$ref: '#/components/schemas/StoredVoiceAttachment'}
        voice_transcript:
          type: [string, 'null']
          maxLength: 100000000
        gif: {$ref: '#/components/schemas/Gif'}
        updated_at: {type: string, format: date-time}
        metadata:
          type: object
          additionalProperties: true
          default: {}
          description: Arbitrary caller-owned JSON object, always returned. Nested JSON values are preserved. PATCH is full replacement; include the metadata
            to retain it.
        reply_to_message_id:
          anyOf:
            - {$ref: '#/components/schemas/MessageReference'}
            - {type: 'null'}
      allOf:
        - if:
            required: [voice_transcript]
            properties:
              voice_transcript: {type: string}
          then:
            required: [voice]
            properties:
              voice: {}
    Presence:
      type: object
      required: [member_id, availability]
      properties:
        member_id: {type: string}
        availability:
          type: string
          enum: [online, offline]
        activity:
          type: [string, 'null']
          enum: [typing, recording_voice, transcribing_voice, uploading_file, searching_gifs, null]
        last_seen_at:
          type: [string, 'null']
          format: date-time
    ClientSocketFrame:
      oneOf:
        - {$ref: '#/components/schemas/PongFrame'}
        - {$ref: '#/components/schemas/AckFrame'}
        - {$ref: '#/components/schemas/ResumeFrame'}
        - {$ref: '#/components/schemas/PresenceFrame'}
        - {$ref: '#/components/schemas/ReceiptCommandFrame'}
        - {$ref: '#/components/schemas/SendMessageFrame'}
        - {$ref: '#/components/schemas/CreateBundleFrame'}
        - {$ref: '#/components/schemas/PingErrorFrame'}
    ServerSocketFrame:
      oneOf:
        - {$ref: '#/components/schemas/ReadyFrame'}
        - {$ref: '#/components/schemas/PingFrame'}
        - {$ref: '#/components/schemas/MessageAcceptedFrame'}
        - {$ref: '#/components/schemas/ReceiptRecordedFrame'}
        - {$ref: '#/components/schemas/MessageDeliveryFrame'}
        - {$ref: '#/components/schemas/ReceiptDeliveryFrame'}
        - {$ref: '#/components/schemas/SocketErrorFrame'}
        - {$ref: '#/components/schemas/BundleCreatedFrame'}
        - {$ref: '#/components/schemas/CommandErrorFrame'}
        - {$ref: '#/components/schemas/AckSuccessFrame'}
        - {$ref: '#/components/schemas/ResumeSuccessFrame'}
        - {$ref: '#/components/schemas/PresenceSuccessFrame'}
    SocketFrame:
      description: Union of client-to-server and server-to-client application frames.
      oneOf:
        - {$ref: '#/components/schemas/ClientSocketFrame'}
        - {$ref: '#/components/schemas/ServerSocketFrame'}
    PongFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: ping.success}
        data:
          type: object
          required: [ping_id]
          properties:
            ping_id: {type: string}
    AckFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: ack}
        data:
          type: object
          required: [member_id, through_sequence]
          properties:
            member_id: {type: string}
            through_sequence: {type: integer, minimum: 0}
    ResumeFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: resume}
        data:
          type: object
          required: [member_id, after_sequence]
          properties:
            member_id: {type: string}
            after_sequence: {type: integer, minimum: 0}
    PresenceFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: presence}
        data:
          type: object
          required: [member_id, activity]
          properties:
            member_id: {type: string}
            activity:
              type: [string, 'null']
              enum: [typing, recording_voice, transcribing_voice, uploading_file, searching_gifs, null]
    ReceiptCommandFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: receipt}
        data:
          type: object
          required: [member_id, conversation_id, message_id, status, device_id]
          properties:
            member_id: {type: string}
            conversation_id: {$ref: '#/components/schemas/ConversationAddress'}
            message_id: {$ref: '#/components/schemas/MessageReference'}
            status:
              type: string
              enum: [delivered, read]
            device_id: {$ref: '#/components/schemas/DeviceId'}
    SendMessageFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: message.create}
        data:
          allOf:
            - type: object
              required: [member_id, org_id, conversation_id, idempotency_key]
              properties:
                member_id: {type: string}
                org_id: {type: string}
                conversation_id: {$ref: '#/components/schemas/ConversationAddress'}
                idempotency_key: {type: string, minLength: 8, maxLength: 255, pattern: '^[!-~]{8,255}$'}
            - {$ref: '#/components/schemas/MessageCreate'}
    ReadyFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: connection.ready}
        data:
          type: object
          required: [protocol_version, connection_id, members, acknowledged_through, testing_generation]
          properties:
            protocol_version: {const: 5}
            connection_id: {type: string, format: uuid}
            members:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items: {type: string}
            acknowledged_through:
              type: object
              additionalProperties: {type: integer, minimum: 0}
            testing_generation:
              type: [integer, 'null']
              minimum: 1
              description: Current testing data generation; null in production. Changed generation requires clearing old local cursors and archived inbox
                before resume0.
    PingFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: ping}
        data:
          type: object
          required: [ping_id]
          properties:
            ping_id: {type: string}
    MessageAcceptedFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: message.create.success}
        data:
          type: object
          additionalProperties: false
          required: [message-id, conversation_id, recipient_id, sender, message, attachments, voice_transcript, reply, bundle, created_at, updated_at, deleted_at,
            delivered_at, read_at, idempotency_key, history]
          properties:
            message-id: {$ref: '#/components/schemas/MessageCode'}
            conversation_id: {$ref: '#/components/schemas/ConversationAddress'}
            recipient_id: {type: string, description: 'History: the destination account or group. Callback: the receiving account, including the sender
                copy.'}
            sender: {$ref: '#/components/schemas/MemberRef'}
            message:
              type: [string, 'null']
              maxLength: 100000000
            attachments:
              type: array
              maxItems: 100
              items: {$ref: '#/components/schemas/AttachmentLink'}
            voice_transcript:
              type: [string, 'null']
              maxLength: 100000000
            reply:
              anyOf:
                - {$ref: '#/components/schemas/Reply'}
                - {type: 'null'}
            bundle:
              anyOf:
                - {$ref: '#/components/schemas/BundleRef'}
                - {type: 'null'}
            created_at: {type: string, format: date-time}
            updated_at:
              type: [string, 'null']
              format: date-time
            deleted_at:
              type: [string, 'null']
              format: date-time
            delivered_at:
              type: [string, 'null']
              format: date-time
            read_at:
              type: [string, 'null']
              format: date-time
            idempotency_key: {type: string}
            history:
              type: array
              items: {$ref: '#/components/schemas/MessageHistoryEntry'}
              description: Previous content, oldest first. Empty initially; deletion adds no history entry. Deleted responses hide content history.
          description: Fixed current snapshot. All fields are present. Text is empty for attachment-only sends, null for tombstones. Upsert by conversation_id,
            message-id and updated_at. Delivery records may hydrate the current edited or deleted snapshot on replay.
    ReceiptRecordedFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: receipt.success}
        data:
          type: object
          description: Ephemeral confirmation that a device receipt was durably recorded. It does not consume a delivery sequence and is not ACKed.
          required: [message_id, status, conversation_id]
          properties:
            message_id: {$ref: '#/components/schemas/MessageReference'}
            status:
              type: string
              enum: [delivered, read]
            conversation_id: {$ref: '#/components/schemas/ConversationAddress'}
    MessageDeliveryFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type:
          enum: [message.created, message.updated, message.deleted]
        data: {$ref: '#/components/schemas/DeliveryMessage'}
    ReceiptDeliveryFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type:
          enum: [message.delivered, message.read, message.failed]
        data: {$ref: '#/components/schemas/DeliveryMessage'}
    SocketErrorFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: connection.error}
        data:
          type: object
          additionalProperties: false
          required: [code, message, recoverable]
          properties:
            code: {type: string}
            message: {type: string}
            recoverable: {type: boolean, description: Whether the socket can remain open; does not promise an unchanged retry will succeed.}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    ApplicationSession:
      type: object
      properties:
        access_token: {type: string, writeOnly: false}
        refresh_token: {type: string}
        token_type: {const: Bearer}
        expires_in: {type: integer, minimum: 1}
        scope: {type: string}
        member: {$ref: '#/components/schemas/MemberRef'}
        organization_id: {type: string, description: Initial workspace; first currently selected organization handle in sorted order.}
        organization_ids:
          type: array
          minItems: 1
          uniqueItems: true
          description: Organizations explicitly selected in IAM with current active memberships. Each request still authorizes X-Org-ID.
          items: {type: string}
      required: [access_token, refresh_token, token_type, expires_in, scope, member, organization_id, organization_ids]
    Identity:
      type: object
      properties:
        member: {$ref: '#/components/schemas/MemberRef'}
        organization_id: {type: string}
        principal_id: {type: string, format: uuid}
        session_id:
          type: [string, 'null']
          format: uuid
        org_role:
          type: [string, 'null']
        capabilities:
          type: array
          items: {type: string}
      required: [member, organization_id, principal_id, session_id, org_role, capabilities]
    LoginInput:
      type: object
      properties:
        slt: {type: string, writeOnly: true, description: Opaque IAM short-lived token. Current IAM wire values use oac_; the field is named slt. Never
            assume the field name is a token prefix.}
      required: [slt]
      additionalProperties: false
    RefreshInput:
      type: object
      properties:
        refresh_token: {type: string, writeOnly: true, pattern: ^ort_}
      required: [refresh_token]
      additionalProperties: false
    LogoutInput:
      type: object
      properties:
        token: {type: string, writeOnly: true}
      required: [token]
      additionalProperties: false
    TestingEnvironment:
      type: object
      properties:
        environment_id: {type: string, format: uuid}
        organization_id: {type: string}
        creator_member_id: {type: string}
        creator_member_kind:
          type: string
          enum: [carbon, silicon]
        name: {type: string, minLength: 1, maxLength: 128}
        description:
          type: [string, 'null']
          maxLength: 4096
        iam_environment_id: {type: string, format: uuid}
        iam_app_id: {type: string}
        status:
          type: string
          enum: [creating, active, deleted, purging]
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        last_activity_at: {type: string, format: date-time}
        deleted_at:
          type: [string, 'null']
          format: date-time
        purge_after:
          type: [string, 'null']
          format: date-time
      required: [environment_id, organization_id, creator_member_id, creator_member_kind, name, description, iam_environment_id, iam_app_id, status, version,
        created_at, last_activity_at, deleted_at, purge_after]
    TestingEnvironmentWithKey:
      allOf:
        - {$ref: '#/components/schemas/TestingEnvironment'}
        - type: object
          properties:
            root_key: {type: string, pattern: '^[A-Za-z0-9]{32}$'}
          required: [root_key]
    TestingEnvironmentKey:
      type: object
      properties:
        environment_id: {type: string, format: uuid}
        root_key: {type: string, pattern: '^[A-Za-z0-9]{32}$'}
      required: [environment_id, root_key]
    TestingEnvironmentList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TestingEnvironment'}
      required: [items]
    TestingEnvironmentCreate:
      type: object
      properties:
        name: {type: string}
        description:
          type: [string, 'null']
        iam_environment_id: {type: string, format: uuid}
        iam_environment_key: {type: string, writeOnly: true, pattern: '^[A-Za-z0-9]{32}$'}
        iam_app_id: {type: string}
        iam_app_secret: {type: string, writeOnly: true}
        iam_webhook_secret:
          type: string
          writeOnly: true
          minLength: 32
          maxLength: 512
          pattern: ^[!-~]{32,512}$
          description: Optional dedicated IAM test webhook signer. Supply together with iam_webhook_key_version, or omit both to inherit the backend signer.
        iam_webhook_key_version: {type: integer, minimum: 1, description: Exact webhook signer version registered in the paired IAM testing application.
            Requires iam_webhook_secret.}
      required: [name, iam_environment_id, iam_environment_key, iam_app_id, iam_app_secret]
      additionalProperties: false
      dependentRequired:
        iam_webhook_secret: [iam_webhook_key_version]
        iam_webhook_key_version: [iam_webhook_secret]
    TestingEnvironmentUpdate:
      type: object
      properties:
        name: {type: string}
        description:
          type: [string, 'null']
          description: Empty string clears displayed description; omitted/null leaves unchanged.
      additionalProperties: false
    MessageCode:
      type: string
      pattern: ^(?:[0-9a-z]{3}|[1-9a-z][0-9a-z]{3,12})$
      examples: ['000', 00a, zzz, '1000']
      description: Lowercase base36 message code, scoped to the conversation. Starts at 000, grows to 1000 after zzz; never reused.
    MessageReference:
      oneOf:
        - {$ref: '#/components/schemas/MessageCode'}
        - {type: string, format: uuid}
    AttachmentLink:
      type: string
      format: uri
      maxLength: 8192
      pattern: ^https://(?![^/?#]*@)[^/?#]+(?:[/?#]|$)
      description: A credential-free HTTPS attachment link. DM stores the URL without fetching it.
    Reply:
      type: object
      additionalProperties: false
      required: [message-id, sender, content]
      properties:
        message-id: {$ref: '#/components/schemas/MessageCode'}
        sender: {$ref: '#/components/schemas/MemberRef'}
        content:
          anyOf:
            - type: object
              required: [message, attachments, voice_transcript]
              properties:
                message:
                  type: [string, 'null']
                  maxLength: 100000000
                attachments:
                  type: array
                  maxItems: 100
                  items: {$ref: '#/components/schemas/AttachmentLink'}
                voice_transcript:
                  type: [string, 'null']
                  maxLength: 100000000
            - {type: 'null'}
          description: Server-resolved current reply content, or null after the referenced message is deleted.
    DeliveryMetadata:
      type: object
      additionalProperties: false
      required: [source, delivery_id, delivery_sequence]
      properties:
        source: {const: dm}
        delivery_id: {type: string, format: uuid}
        delivery_sequence: {type: integer, minimum: 1, description: Per receiving account transport cursor for ACK and replay; not a message sequence.}
    ConversationSummary:
      type: object
      required: [id, org_id, participants, last_message, last_message_status, created_at, updated_at]
      properties:
        id:
          type: string
          description: Immutable conversation address.
          examples: ['alice@example.com::bob@example.com', 'g:acme:engineering']
        org_id: {type: string, description: Matches X-Org-ID.}
        participants:
          type: array
          items: {$ref: '#/components/schemas/MemberRef'}
          description: Everyone currently granted access.
        group: {$ref: '#/components/schemas/GroupSummary', description: Omitted for normal DMs.}
        last_message:
          anyOf:
            - {$ref: '#/components/schemas/MessagePreview'}
            - {type: 'null'}
          description: Latest visible message; null when none exist.
        last_message_status:
          type: [string, 'null']
          enum: [sent, delivered, read, null]
          description: Sent means accepted; delivered/read requires every recipient. Null when no message exists.
        created_at: {type: string, format: date-time}
        updated_at:
          type: string
          format: date-time
          description: Advances on messages/replies, edits, deletions, reactions, and group details/membership changes. Excludes typing, presence, receipts,
            and drafts.
    GroupSummary:
      type: object
      required: [name, description, tag_ids]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 4000, description: Empty string when unset.}
        tag_ids:
          type: array
          maxItems: 100
          items: {type: string, format: uuid}
          description: Any matching tag grants private-group access.
    MessageContent:
      type: object
      required: [message, attachments, voice_transcript]
      properties:
        message:
          type: [string, 'null']
          description: Text; empty for attachment-only messages; null after deletion.
        attachments:
          type: array
          items: {type: string, format: uri, pattern: '^https://'}
          description: File/audio/GIF URLs; empty when absent or deleted.
        voice_transcript:
          type: [string, 'null']
          description: Audio transcript; null when absent or deleted.
    MessagePreview:
      allOf:
        - {$ref: '#/components/schemas/MessageContent'}
        - type: object
          required: [message-id, conversation_id, recipient_id, sender, reply, bundle, created_at, updated_at, deleted_at, delivered_at, read_at, history]
          properties:
            message-id: {type: string, description: Conversation-local lowercase base36 code., example: 00a}
            conversation_id: {type: string, description: Parent conversation address.}
            recipient_id: {type: string, description: Destination account or group address.}
            sender: {$ref: '#/components/schemas/MemberRef'}
            reply:
              anyOf:
                - {$ref: '#/components/schemas/ReplyPreview'}
                - {type: 'null'}
              description: Null for non-replies or deleted messages.
            bundle:
              anyOf:
                - {$ref: '#/components/schemas/BundleRef'}
                - {type: 'null'}
              description: Null when unbundled.
            created_at: {type: string, format: date-time}
            updated_at:
              type: [string, 'null']
              format: date-time
              description: Last edit; null if never edited.
            deleted_at:
              type: [string, 'null']
              format: date-time
              description: Deletion time; null if not deleted.
            delivered_at:
              type: [string, 'null']
              format: date-time
              description: All-recipient delivery time; null until reached.
            read_at:
              type: [string, 'null']
              format: date-time
              description: All-recipient read time; null until reached.
            history:
              type: array
              items: {$ref: '#/components/schemas/MessageHistoryEntry'}
              description: Previous content, oldest first. Empty initially; deletion adds no history entry. Deleted responses hide content history.
    ReplyPreview:
      type: object
      required: [message-id, sender, content]
      properties:
        message-id: {type: string, example: 009}
        sender: {$ref: '#/components/schemas/MemberRef'}
        content:
          anyOf:
            - {$ref: '#/components/schemas/MessageContent'}
            - {type: 'null'}
          description: Referenced content; null after its deletion.
    ErrorResponse:
      type: object
      required: [type, data]
      properties:
        type: {type: string, const: error}
        data:
          type: object
          required: [error]
          properties:
            error:
              type: object
              required: [code, message]
              properties:
                code: {type: string, description: Machine-readable failure code; see each response example.}
                message: {type: string, description: Human-readable explanation; clients branch on code rather than message text.}
    BundleCode:
      type: string
      pattern: ^(?:00[1-9a-z]|0[1-9a-z][0-9a-z]|[1-9a-z][0-9a-z]{2,})$
      description: Conversation-local sequential lowercase base36 bundle code. Starts at 001; increments for each new bundle and grows beyond three characters
        after zzz.
      examples: ['001', '002', 009, 00a, 00z, '010', zzz, '1000']
    DeviceId:
      type: string
      minLength: 1
      maxLength: 255
      pattern: ^[^\u0000-\u001F\u007F-\u009F]+$
      x-max-utf8-bytes: 255
      description: Client-chosen stable device/consumer ID. Reuse on reconnect and receipts; independent client installations should use distinct IDs. Accepts
        1–255 UTF-8 bytes, including spaces and Unicode, but no control characters. Not a hardware ID or credential.
      examples: [laptop-browser-1, phone-app-1, f96100cd-d86e-470b-88eb-4721830e59e1]
    SubscribeFrame:
      type: object
      required: [type, data]
      properties:
        type: {type: string, const: subscribe}
        data:
          type: object
          required: [subscription_id, token, organization_id, member_id, device_id]
          properties:
            subscription_id: {type: string, minLength: 1, maxLength: 128, description: 'Client-assigned ID, unique among active subscriptions on this socket.'}
            token: {type: string, writeOnly: true, description: 'Access token for this subscription, sent in the frame rather than the URL.'}
            organization_id: {type: string}
            member_id: {type: string, description: Must identify the authenticated account.}
            device_id: {$ref: '#/components/schemas/DeviceId'}
            testing_key:
              type: [string, 'null']
              description: Optional test app secret or testing key; omit for production.
            testing_generation:
              type: [integer, 'null']
              minimum: 1
            telemetry_enabled:
              type: [boolean, 'null']
              description: Optional telemetry preference; false disables it for this subscription.
          additionalProperties: false
      additionalProperties: false
    UnsubscribeFrame:
      type: object
      required: [type, data]
      properties:
        type: {type: string, const: unsubscribe}
        data:
          type: object
          required: [subscription_id]
          properties:
            subscription_id: {type: string, minLength: 1, maxLength: 128, description: 'Client-assigned ID, unique among active subscriptions on this socket.'}
          additionalProperties: false
      additionalProperties: false
    PrewarmedFrame:
      type: object
      required: [type, data]
      properties:
        type: {type: string, const: connection.prewarmed}
        data:
          type: object
          required: [protocol_version, max_subscriptions]
          properties:
            protocol_version: {type: integer, const: 2}
            max_subscriptions: {type: integer, const: 64}
          additionalProperties: false
      additionalProperties: false
    SharedClientChannelFrame:
      type: object
      required: [type, data]
      properties:
        type: {type: string, const: channel}
        data:
          type: object
          required: [subscription_id, frame]
          properties:
            subscription_id: {type: string, minLength: 1, maxLength: 128, description: 'Client-assigned ID, unique among active subscriptions on this socket.'}
            frame: {$ref: '#/components/schemas/ClientSocketFrame'}
          additionalProperties: false
      additionalProperties: false
    SubscriptionErrorFrame:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [subscribe.error, subscription.closed]
        data:
          type: object
          required: [code, recoverable]
          properties:
            code:
              type: string
              enum: [subscription_rejected, subscription_closed]
            message: {type: string}
            recoverable: {type: boolean, const: false}
          additionalProperties: false
      additionalProperties: false
      allOf:
        - if:
            properties:
              type: {const: subscribe.error}
          then:
            properties:
              data:
                properties:
                  code: {const: subscription_rejected}
        - if:
            properties:
              type: {const: subscription.closed}
          then:
            properties:
              data:
                properties:
                  code: {const: subscription_closed}
    SharedServerChannelFrame:
      type: object
      required: [type, data]
      properties:
        type: {type: string, const: channel}
        data:
          type: object
          required: [subscription_id, frame]
          properties:
            subscription_id: {type: string, minLength: 1, maxLength: 128, description: 'Client-assigned ID, unique among active subscriptions on this socket.'}
            frame:
              anyOf:
                - {$ref: '#/components/schemas/ServerSocketFrame'}
                - {$ref: '#/components/schemas/SubscriptionErrorFrame'}
                - {$ref: '#/components/schemas/SubscribeSuccessFrame'}
          additionalProperties: false
      additionalProperties: false
    SharedClientSocketFrame:
      oneOf:
        - {$ref: '#/components/schemas/SubscribeFrame'}
        - {$ref: '#/components/schemas/UnsubscribeFrame'}
        - {$ref: '#/components/schemas/SharedClientChannelFrame'}
        - {$ref: '#/components/schemas/PongFrame'}
        - {$ref: '#/components/schemas/PingErrorFrame'}
    SharedServerSocketFrame:
      oneOf:
        - {$ref: '#/components/schemas/PrewarmedFrame'}
        - {$ref: '#/components/schemas/SharedServerChannelFrame'}
        - {$ref: '#/components/schemas/PingFrame'}
        - {$ref: '#/components/schemas/UnsubscribeSuccessFrame'}
        - {$ref: '#/components/schemas/UnsubscribeErrorFrame'}
        - {$ref: '#/components/schemas/SocketErrorFrame'}
    DeliveryMessage:
      type: object
      additionalProperties: false
      required: [message-id, conversation_id, recipient_id, sender, message, attachments, voice_transcript, reply, bundle, created_at, updated_at, deleted_at,
        delivered_at, read_at, metadata, history]
      properties:
        message-id: {$ref: '#/components/schemas/MessageCode'}
        conversation_id: {$ref: '#/components/schemas/ConversationAddress'}
        recipient_id: {type: string, description: 'History: the destination account or group. Callback: the receiving account, including the sender copy.'}
        sender: {$ref: '#/components/schemas/MemberRef'}
        message:
          type: [string, 'null']
          maxLength: 100000000
        attachments:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/AttachmentLink'}
        voice_transcript:
          type: [string, 'null']
          maxLength: 100000000
        reply:
          anyOf:
            - {$ref: '#/components/schemas/Reply'}
            - {type: 'null'}
        bundle:
          anyOf:
            - {$ref: '#/components/schemas/BundleRef'}
            - {type: 'null'}
        created_at: {type: string, format: date-time}
        updated_at:
          type: [string, 'null']
          format: date-time
        deleted_at:
          type: [string, 'null']
          format: date-time
        delivered_at:
          type: [string, 'null']
          format: date-time
        read_at:
          type: [string, 'null']
          format: date-time
        metadata: {$ref: '#/components/schemas/DeliveryMetadata'}
        history:
          type: array
          items: {$ref: '#/components/schemas/MessageHistoryEntry'}
          description: Previous content, oldest first. Empty initially; deletion adds no history entry. Deleted responses hide content history.
      description: Message snapshot with delivery metadata for WebSocket ACK/replay.
    CreateBundleFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: bundle}
        data:
          allOf:
            - type: object
              required: [member_id, org_id, conversation_id, idempotency_key]
              properties:
                member_id: {type: string, description: 'Authorized Silicon creating the bundle; must have access to the conversation. On a shared socket,
                    must match the subscription member.'}
                org_id: {type: string, description: Must match the authorized connection or subscription organization.}
                conversation_id: {$ref: '#/components/schemas/ConversationAddress'}
                idempotency_key: {type: string, minLength: 8, maxLength: 255, pattern: '^[!-~]{8,255}$'}
            - {$ref: '#/components/schemas/BundleCreate'}
      description: Create a bundle atomically using the HTTP bundle rules. 1–100 unique existing messages from the same conversation, none already bundled;
        caller supplies display content. Reuse the idempotency key and identical content after timeout or reconnect. Same key and content returns the same
        bundle; changed content conflicts. No partial bundle or display message on failure.
    BundleCreatedFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: bundle.success}
        data:
          allOf:
            - {$ref: '#/components/schemas/Bundle'}
            - type: object
              required: [member_id, idempotency_key]
              properties:
                member_id: {type: string, description: 'Authorized Silicon creating the bundle; must have access to the conversation. On a shared socket,
                    must match the subscription member.'}
                idempotency_key: {type: string, minLength: 8, maxLength: 255, pattern: '^[!-~]{8,255}$'}
      description: Durable creation confirmation, also returned for an identical retry. Correlate by member_id, conversation_id and idempotency_key. No
        delivery ACK for this frame; the display message is delivered separately as message.created with data.metadata.
    CommandErrorFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type:
          type: string
          enum: [message.create.error, bundle.error, ack.error, resume.error, presence.error, receipt.error]
        data:
          type: object
          additionalProperties: false
          required: [code, message, recoverable]
          properties:
            code: {type: string}
            message: {type: string}
            recoverable: {type: boolean, description: Whether the socket can remain open; does not promise an unchanged retry will succeed.}
            member_id: {type: string, description: 'Member from the request, when parseable.'}
            conversation_id: {$ref: '#/components/schemas/ConversationAddress'}
            idempotency_key: {type: string, minLength: 8, maxLength: 255, pattern: '^[!-~]{8,255}$'}
            message_id: {$ref: '#/components/schemas/MessageReference'}
            device_id: {$ref: '#/components/schemas/DeviceId'}
            through_sequence: {type: integer, minimum: 0}
            after_sequence: {type: integer, minimum: 0}
      description: Failure of the command named by type. Echo available request identifiers in data for correlation; omit invalid or unparseable identifiers.
        message.create.error and bundle.error echo idempotency_key when valid. Error and success frames are not delivery events and must not be ACKed.
    SubscribeSuccessFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: subscribe.success}
        data:
          type: object
          required: [protocol_version, connection_id, members, acknowledged_through, testing_generation]
          properties:
            protocol_version: {const: 5}
            connection_id: {type: string, format: uuid}
            members:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items: {type: string}
            acknowledged_through:
              type: object
              additionalProperties: {type: integer, minimum: 0}
            testing_generation:
              type: [integer, 'null']
              minimum: 1
              description: Current testing data generation; null in production. Changed generation requires clearing old local cursors and archived inbox
                before resume0.
    AckSuccessFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: ack.success}
        data:
          type: object
          required: [member_id, through_sequence]
          properties:
            member_id: {type: string}
            through_sequence: {type: integer, minimum: 0}
    ResumeSuccessFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: resume.success}
        data:
          type: object
          required: [member_id, after_sequence]
          properties:
            member_id: {type: string}
            after_sequence: {type: integer, minimum: 0}
    PresenceSuccessFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: presence.success}
        data:
          type: object
          required: [member_id, activity]
          properties:
            member_id: {type: string}
            activity:
              type: [string, 'null']
              enum: [typing, recording_voice, transcribing_voice, uploading_file, searching_gifs, null]
    PingErrorFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: ping.error}
        data:
          type: object
          additionalProperties: false
          required: [ping_id, code, message, recoverable]
          properties:
            ping_id: {type: string}
            code: {type: string}
            message: {type: string}
            recoverable: {type: boolean, description: Whether the socket can remain open; does not promise an unchanged retry will succeed.}
    UnsubscribeSuccessFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: unsubscribe.success}
        data:
          type: object
          required: [subscription_id]
          properties:
            subscription_id: {type: string, minLength: 1, maxLength: 128, description: 'Client-assigned ID, unique among active subscriptions on this socket.'}
          additionalProperties: false
    UnsubscribeErrorFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: {type: string, const: unsubscribe.error}
        data:
          type: object
          additionalProperties: false
          required: [code, message, recoverable]
          properties:
            subscription_id: {type: string}
            code: {type: string}
            message: {type: string}
            recoverable: {type: boolean, description: Whether the socket can remain open; does not promise an unchanged retry will succeed.}
    MessageHistoryEntry:
      type: object
      additionalProperties: false
      required: [message, attachments, voice_transcript, reply, created_at]
      properties:
        message:
          type: [string, 'null']
          description: Text; empty for attachment-only messages; null after deletion.
        attachments:
          type: array
          items: {type: string, format: uri, pattern: '^https://'}
          description: File/audio/GIF URLs; empty when absent or deleted.
        voice_transcript:
          type: [string, 'null']
          description: Audio transcript; null when absent or deleted.
        reply:
          anyOf:
            - {$ref: '#/components/schemas/Reply'}
            - {type: 'null'}
        created_at: {type: string, format: date-time, description: When this content became current.}
