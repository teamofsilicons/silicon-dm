  /api/v1/conversations/{conversation_id}/messages/{message_id}:
    get:
      tags: [Messages]
      operationId: getMessage
      summary: Get a message and its content and edit history
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/ConversationId'}
        - {$ref: '#/components/parameters/MessageId'}
        - {$ref: '#/components/parameters/TestingKey'}
      responses:
        '200':
          description: Latest message or deletion tombstone
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [type, data]
                properties:
                  type: {type: string, const: message}
                  data: {$ref: '#/components/schemas/Message'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [Messages]
      operationId: editMessage
      summary: Replace an authored message with optimistic concurrency
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/ConversationId'}
        - {$ref: '#/components/parameters/MessageId'}
        - {$ref: '#/components/parameters/TestingKey'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/MessageVersion'}
      responses:
        '200':
          description: Latest message or deletion tombstone
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [type, data]
                properties:
                  type: {type: string, const: message.updated}
                  data: {$ref: '#/components/schemas/Message'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
        '409':
          description: Version or idempotency conflict; fetch latest Message
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [type, data]
                properties:
                  type: {type: string, const: error}
                  data: {$ref: '#/components/schemas/Error'}
      description: Only the sender can change the message. Idempotency keys prevent duplicate retries. Edits serialize in arrival order and preserve the
        previous content in history; deletion sets deleted_at without adding history. Deleted messages cannot be edited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, data]
              properties:
                type: {type: string, const: message.updated}
                data: {$ref: '#/components/schemas/MessageCreate'}
    delete:
      tags: [Messages]
      operationId: deleteMessage
      summary: Publish an authored message deletion tombstone
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/ConversationId'}
        - {$ref: '#/components/parameters/MessageId'}
        - {$ref: '#/components/parameters/TestingKey'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/MessageVersion'}
      responses:
        '200':
          description: Latest message or deletion tombstone
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [type, data]
                properties:
                  type: {type: string, const: message.deleted}
                  data: {$ref: '#/components/schemas/Message'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
        '409':
          description: Version or idempotency conflict; fetch latest Message
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [type, data]
                properties:
                  type: {type: string, const: error}
                  data: {$ref: '#/components/schemas/Error'}
      description: Only the sender can change the message. Idempotency keys prevent duplicate retries. Edits serialize in arrival order and preserve the
        previous content in history; deletion sets deleted_at without adding history. Deleted messages cannot be edited.
