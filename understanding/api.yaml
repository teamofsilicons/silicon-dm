            example:
              type: channel
              data:
                subscription_id: assistant-work
                frame:
                  type: bundle.error
                  data:
                    code: conflict
                    message: idempotency key was already used with different request content
                    recoverable: true
                    member_id: si:assistant
                    conversation_id: g:acme:engineering
                    idempotency_key: bundle-engineering-001
          - name: unsubscribe.success
            direction: server → client
            schema: {$ref: '#/components/schemas/UnsubscribeSuccessFrame'}
            description: Confirms the subscription is removed; other subscriptions remain active. Repeating removal of an absent ID also succeeds.
