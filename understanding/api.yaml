          - name: 'channel: ack'
            direction: client → server
            schema: {$ref: '#/components/schemas/SharedClientChannelFrame'}
            description: On the indicated authenticated subscription. Cumulative ACK after durably processing every delivery through this sequence; cannot
              ACK beyond what this connection emitted.
            example:
