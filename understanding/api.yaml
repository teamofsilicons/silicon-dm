            direction: server → client
            schema: {$ref: '#/components/schemas/SharedServerChannelFrame'}
            description: On the indicated authenticated subscription. Rejects this command; echoes its available identifiers. Correct the request before
              retrying; the socket stays open.
            example:
              type: channel
              data:
                subscription_id: alice-acme
                frame:
                  type: message.create.error
                  data:
