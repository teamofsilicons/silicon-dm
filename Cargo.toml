[workspace]
members = [".", "crates/client", "crates/cli"]
resolver = "3"

[package]
name = "silicon-dm"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "LicenseRef-Proprietary"
publish = false
default-run = "dm-api"

[lib]
name = "silicon_dm"
path = "src/lib.rs"

[[bin]]
name = "dm-api"
path = "src/bin/dm_api.rs"

[[bin]]
name = "dm-worker"
path = "src/bin/dm_worker.rs"

[[bin]]
name = "dm-migrate"
path = "src/bin/dm_migrate.rs"

[dependencies]
silicon-iam-client = "1.4.0"
aes-gcm = "0.10.3"
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["http2", "json", "macros", "matched-path", "ws"] }
base64 = "0.22.1"
blake3 = "1.8.2"
dashmap = "6.1.0"
dotenvy = "0.15.7"
futures = "0.3.31"
http = "1.3.1"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "http2", "json", "query", "rustls", "stream"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring-native-roots", "uuid"] }
subtle = "2.6.1"
thiserror = "2.0.17"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
tower = "0.5.2"
tower-http = { version = "0.7.0", features = ["catch-panic", "request-id", "sensitive-headers", "timeout", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.26.0", features = ["serde", "v4", "v7"] }

[dev-dependencies]
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
wiremock = "0.6.5"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
needless_raw_string_hashes = "allow"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
