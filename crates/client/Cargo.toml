[package]
name = "silicon-dm-client"
version = "0.17.2"
edition = "2024"
rust-version = "1.98"
license = "LicenseRef-Proprietary"
description = "Typed HTTP client for DM (contract 4), with Silicon Accounts sign-in and the CLI's local runtime"
readme = "README.md"
repository = "https://github.com/teamofsilicons/silicon-dm"

[features]
default = []
# Sign in to DM with Silicon Accounts as DM's public client (device flow, short-lived tokens).
accounts = ["dep:silicon-accounts-client", "tokio/time"]
# The CLI's local runtime: stored sign-ins, the durable outgoing relay, the sync inbox.
runtime = ["accounts", "silicon-dm-protocol/http", "dep:anyhow", "dep:axum", "dep:blake3", "dep:fs2", "dep:libc", "dep:rusqlite", "dep:semver", "dep:time", "dep:windows-sys", "tokio/macros", "tokio/rt-multi-thread", "tokio/signal", "tokio/sync", "tokio/process"]

[[bin]]
name = "dm-relay"
path = "src/bin/dm_relay.rs"
required-features = ["runtime"]

[dependencies]
silicon-dm-protocol = { path = "../protocol", version = "0.17.2" }
silicon-accounts-client = { version = "0.4.0", optional = true }
anyhow = { version = "1.0.100", optional = true }
axum = { version = "0.8.9", features = ["json", "tokio", "http1"], optional = true }
blake3 = { version = "1.8.2", optional = true }
fs2 = { version = "0.4", optional = true }
libc = { version = "0.2", optional = true }
rusqlite = { version = "0.38", features = ["bundled"], optional = true }
semver = { version = "1", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "query", "rustls", "http2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
time = { version = "0.3.55", features = ["formatting"], optional = true }
tokio = { version = "1.53.1", features = ["net", "time"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }

[dev-dependencies]
axum = { version = "0.8.9", features = ["json", "form", "query", "tokio", "http1"] }
tempfile = "3"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }
