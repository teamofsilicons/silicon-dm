[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# These first-party packages use the same proprietary license as the DM backend.
# Keep this scoped to DM's own crates rather than permitting proprietary dependencies globally.
exceptions = [
  { name = "silicon-dm-client", allow = ["LicenseRef-Proprietary"] },
  { name = "silicon-dm-protocol", allow = ["LicenseRef-Proprietary"] },
]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

[sources]
unknown-git = "deny"
unknown-registry = "deny"
