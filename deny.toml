[advisories]
yanked = "deny"
ignore = [
  # RUSTSEC-2023-0071 (Marvin): timing side channel in RSA private-key operations. `rsa`
  # arrives through jsonwebtoken's rust_crypto backend (silicon-accounts-client); DM only
  # verifies EdDSA tokens with public keys and performs no RSA private-key operation. No
  # fixed `rsa` release exists.
  { id = "RUSTSEC-2023-0071", reason = "EdDSA public-key verification only; no RSA private-key operations" },
  # crypto-bigint 0.5 is pulled in by jsonwebtoken's unused P-256/P-384 backend.
  # silicon-accounts-client::jwt::verify rejects every algorithm except EdDSA
  # before verification. DM neither signs with these curves nor operates on secret
  # crypto-bigint integers. The fixed 0.7.6 is incompatible with elliptic-curve 0.13.
  # Remove this exception when the Accounts SDK's JWT dependency drops that backend.
  { id = "RUSTSEC-2026-0387", reason = "Unused P-256/P-384 transitive backend; Accounts accepts EdDSA only and DM performs no crypto-bigint secret arithmetic" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# These first-party packages use the same proprietary license as the DM backend.
# Keep this scoped to DM's own crates rather than permitting proprietary dependencies globally.
exceptions = [
  { name = "silicon-dm-client", allow = ["LicenseRef-Proprietary"] },
  { name = "silicon-dm-protocol", allow = ["LicenseRef-Proprietary"] },
]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

[sources]
unknown-git = "deny"
unknown-registry = "deny"
