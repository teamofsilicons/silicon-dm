# Silicon Apps installs prebuilt commands without running a runtime installer,
# so link the Microsoft CRT into both Windows executables.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
