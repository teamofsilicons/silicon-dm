openapi.yaml:
  # Silicon Accounts delivers app webhooks to this exact trailing-slash URL.
  no-path-trailing-slash:
    - '#/paths/~1webhook~1'
  # Public health probes have no authentication or user-input 4xx branch.
  operation-4xx-response:
    - '#/paths/~1live/get/responses'
    - '#/paths/~1ready/get/responses'
  # The retired WebSocket route only ever answers 410 delivery_moved.
  operation-2xx-response:
    - '#/paths/~1api~1v1~1ws/get/responses'
