        default: {$ref: '#/components/responses/Error'}
  /api/v1/conversations/{conversation_id}/draft:
    get:
      tags: [Drafts]
      operationId: getDraft
      summary: Get the current member's draft
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/ConversationId'}
        - {$ref: '#/components/parameters/TestingKey'}
      responses:
        '200':
          description: Current member's synchronized draft
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [type, data]
                properties:
                  type: {type: string, const: draft}
                  data: {$ref: '#/components/schemas/Draft'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: No draft}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [Drafts]
      operationId: putDraft
      summary: Create or conditionally replace a draft
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/ConversationId'}
        - name: If-Match
          in: header
          schema: {type: integer, minimum: 0}
          description: Exact last observed draft version. Omit or send 0 only when creating a draft that does not yet exist. Versions continue increasing
            across deletion and automatic clearing; use the returned version for the next save.
        - {$ref: '#/components/parameters/TestingKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, data]
              properties:
                type: {type: string, const: put_draft}
                data: {$ref: '#/components/schemas/DraftInput'}
      responses:
        '200':
          description: Draft stored
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [type, data]
                properties:
                  type: {type: string, const: put_draft}
                  data: {$ref: '#/components/schemas/Draft'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: Version conflict (draft_conflict). Returns an error code and recovery message alongside the current draft when one exists, or an error envelope when it was deleted after the supplied version
            was observed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [type, data]
                properties:
                  type: {type: string, const: error}
                  data:
                    anyOf:
                      - allOf:
                          - {$ref: '#/components/schemas/Draft'}
                          - {$ref: '#/components/schemas/Error'}
                      - {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Drafts]
      operationId: deleteDraft
      summary: Delete the current member's draft
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/ConversationId'}
        - {$ref: '#/components/parameters/TestingKey'}
      responses:
        '204': {description: Draft deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
