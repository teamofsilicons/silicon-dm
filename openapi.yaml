openapi: 3.1.0
servers:
  - url: https://backend.dm.teamofsilicons.com
info: {title: DM API, version: 0.10.1}
security:
  - bearerAuth: []
tags:
  - {name: Conversations, description: Exact-participant-set conversations}
  - {name: Groups, description: Named organization groups with invitations and dynamic IAM tag access}
  - {name: Messages, description: 'Durable content, receipts, and attachment access'}
  - {name: Bundles, description: Non-destructive Silicon message bundles}
  - {name: Drafts, description: Private cross-device draft synchronization}
  - {name: Presence, description: Authorized availability and transient activity}
  - {name: GIFs, description: Safe Giphy discovery and recent history}
  - {name: Auth, description: IAM application-session exchange and maintenance}
  - {name: Testing, description: Honeycomb owns shared test lifecycle; legacy controls require production IAM authority}
  - {name: IAM webhooks, description: 'Signed IAM callbacks, outside the /api/v1 base path'}
  - {name: Operations, description: Deployment health probes}
  - {name: Delivery, description: Explicit Ting recipient enrollment and authoritative HTTP recovery}
paths:
  /api/v1/delivery/registration:
    post:
      operationId: registerTingDelivery
      tags: [Delivery]
      summary: Explicitly enroll the authenticated recipient for Ting notifications.
      description: >-
        Registers or reconnects the authenticated actor's dm recipient grant in Ting using
        their current IAM consent. Requires the approved external subscriptions.register scope
        and self.identity.read. This is not a Ting login or webhook registration. Completed
        Idempotency-Key retries return the cached public subscription without reactivating a
        later revocation. An in-flight or uncertain previous result returns 409; a new explicit
        registration requires a new key. No user tokens or proofs are persisted.
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/TestingKey'}
        - {$ref: '#/components/parameters/TestingGeneration'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, data]
              properties:
                type: {type: string, const: delivery_registration}
                data: {type: object, additionalProperties: false}
            example: {type: delivery_registration, data: {}}
      responses:
        '200':
          description: Confirmed recipient subscription or the original cached result.
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {type: string, const: delivery_registration}
                  data: {$ref: '#/components/schemas/TingSubscription'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/sync:
    get:
      operationId: syncEvents
      tags: [Delivery]
      summary: Recover authoritative event references for the authenticated actor.
      description: >-
        Returns bounded references under current conversation and group permissions. Cursors
        bind the actor, organization, testing environment and cleaning generation, and expire
        after 24 hours. Continue with the returned cursor while has_more is true; filtered
        inaccessible events can produce an empty page with more work. A Ting event sequence
        must never replace this cursor. A 409 sync_reset_required means obtain a reset cursor,
        refresh authorized conversations and messages, then resume from that cursor.
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/TestingKey'}
        - {$ref: '#/components/parameters/TestingGeneration'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - name: reset
          in: query
          schema: {type: boolean, default: false}
          description: Return an empty event page with a cursor at the current head. Cannot be combined with cursor.
      responses:
        '200':
          description: Current authorized references and the next authoritative cursor.
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {type: string, const: sync}
                  data: {$ref: '#/components/schemas/SyncPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/presence/devices/{device_id}:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
      - {$ref: '#/components/parameters/TestingKey'}
      - {$ref: '#/components/parameters/TestingGeneration'}
      - name: device_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/DeviceId'}
        description: Stable device identifier without control characters, scoped to the authenticated actor.
    put:
      operationId: renewDevicePresence
      tags: [Presence]
      summary: Renew the authenticated actor's HTTP device presence lease.
      description: >-
        Sets a bounded lease for this device independently of Ting delivery. Omitted or null
        activity clears the device's activity. A lease never grants message access and is not
        a delivery or read receipt. All requests revalidate IAM authority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, data]
              properties:
                type: {type: string, const: renew_presence}
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    activity:
                      type: [string, 'null']
                      enum: [typing, recording_voice, transcribing_voice, uploading_file, searching_gifs, null]
            example: {type: renew_presence, data: {activity: typing}}
      responses:
        '200':
          description: Renewed device deadline and aggregate actor presence.
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {type: string, const: renew_presence}
                  data: {$ref: '#/components/schemas/PresenceLease'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    delete:
      operationId: closeDevicePresence
      tags: [Presence]
      summary: Close the authenticated actor's named HTTP presence lease.
      description: Does not close other devices or change Ting destinations. Repeated closure is harmless.
      responses:
        '204': {description: The device is no longer online through this lease.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/conversations:
    get:
      summary: List accessible DMs and groups in one organization, newest activity first.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Org-ID
          in: header
          required: true
          schema: {type: string}
          example: acme
        - name: X-Testing-Environment-Key
          in: header
          schema: {type: string}
          description: Optional testing key; omit for production.
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: cursor
          in: query
          schema: {type: string}
          description: Previous next_cursor; omit for the first page.
      responses:
        '200':
          description: Conversations; an empty list is also a successful response.
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {type: string, const: conversations}
                  data:
                    type: object
                    required: [items, next_cursor]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/ConversationSummary'}
                      next_cursor:
                        type: [string, 'null']
                        description: Continuation token; null on the last page.
              examples:
                group:
                  summary: A group conversation.
                  value:
                    type: conversations
                    data:
                      items:
                        - id: g:acme:engineering
                          org_id: acme
                          participants:
                            - {type: carbon, id: alice@example.com}
                            - {type: carbon, id: bob@example.com}
                          group:
                            name: Engineering
                            description: Engineering discussions
                            tag_ids: []
                          last_message:
                            message-id: 00a
                            conversation_id: g:acme:engineering
                            recipient_id: g:acme:engineering
                            sender: {type: carbon, id: alice@example.com}
                            message: Can you review this?
                            attachments: []
                            voice_transcript: null
                            reply: null
                            bundle: null
                            created_at: '2026-09-17T10:00:00Z'
                            updated_at: null
                            deleted_at: null
                            delivered_at: '2026-09-17T10:00:02Z'
                            read_at: null
                            history: []
                          last_message_status: delivered
                          created_at: '2026-09-17T08:00:00Z'
                          updated_at: '2026-09-17T10:00:00Z'
                      next_cursor: null
                normal_chat:
                  summary: A normal DM; no group field.
                  value:
                    type: conversations
                    data:
                      items:
                        - id: alice@example.com::bob@example.com
                          org_id: acme
                          participants:
                            - {type: carbon, id: alice@example.com}
                            - {type: carbon, id: bob@example.com}
                          last_message:
                            message-id: 00a
                            conversation_id: alice@example.com::bob@example.com
                            recipient_id: bob@example.com
                            sender: {type: carbon, id: alice@example.com}
                            message: Can you review this?
                            attachments: []
                            voice_transcript: null
                            reply: null
                            bundle: null
                            created_at: '2026-09-17T10:00:00Z'
                            updated_at: null
                            deleted_at: null
                            delivered_at: '2026-09-17T10:00:02Z'
                            read_at: null
                            history: []
                          last_message_status: delivered
                          created_at: '2026-09-17T08:00:00Z'
                          updated_at: '2026-09-17T10:00:00Z'
                      next_cursor: null
                empty:
                  summary: No chats or groups.
                  value:
                    type: conversations
                    data:
                      items: []
                      next_cursor: null
      tags: [Conversations]
    post:
      summary: Create an empty conversation or return the existing conversation for the same participants.
      description: 'The caller is included automatically. Duplicate IDs are collapsed; 2–100 unique

        participants including the caller are required. Everyone must have verifiable

        active membership in the selected organization. Offline members are allowed.

        A conversation is shared: a member not having opened it does not create a new copy.

        An existing conversation keeps its ID, history, and activity timestamps.

        A different participant set creates a different conversation, not an invitation

        into an existing one. No message is sent. This does not create a named group.'
      security:
        - bearerAuth: []
      parameters:
        - name: X-Org-ID
          in: header
          required: true
          schema: {type: string}
          example: acme
        - name: Idempotency-Key
          in: header
          required: true
          description: Reuse for retries of the same request; different participants require a new key.
          schema: {type: string, minLength: 8, maxLength: 255, pattern: '^[!-~]{8,255}$'}
          example: create-alice-bob-001
        - name: X-Testing-Environment-Key
          in: header
          schema: {type: string}
          description: Optional testing key; omit for production.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              additionalProperties: false
              properties:
                type: {type: string, const: create_conversation}
                data:
                  type: object
                  required: [participant_ids]
                  additionalProperties: false
                  properties:
                    participant_ids:
                      type: array
                      minItems: 1
                      description: IAM account IDs; at least one must be someone other than the caller. Maximum 100 unique participants after including
                        the caller.
                      items: {type: string, minLength: 1, maxLength: 255}
            examples:
              normal_chat:
                summary: Alice creates or retrieves her conversation with Bob.
                value:
                  type: create_conversation
                  data:
                    participant_ids: [bob@example.com]
              multiple_members:
                summary: Alice creates or retrieves a conversation with Bob and an agent.
                value:
                  type: create_conversation
                  data:
                    participant_ids: [bob@example.com, 'si:assistant']
              unknown_member:
                summary: If one requested member cannot be verified, the entire request fails with 422.
                value:
                  type: create_conversation
                  data:
                    participant_ids: [bob@example.com, missing@example.com]
      responses:
        '201':
          description: New or existing conversation. The current API uses 201 for both, including retries; there is no separate created flag.
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {type: string, const: create_conversation}
                  data: {$ref: '#/components/schemas/ConversationSummary'}
              examples:
                created:
                  summary: No conversation exists for Alice and Bob; create one accessible to both.
                  value:
                    type: create_conversation
                    data:
                      id: alice@example.com::bob@example.com
                      org_id: acme
                      participants:
                        - {type: carbon, id: alice@example.com}
                        - {type: carbon, id: bob@example.com}
                      last_message: null
                      last_message_status: null
                      created_at: '2026-09-17T10:00:00Z'
                      updated_at: '2026-09-17T10:00:00Z'
                already_exists:
                  summary: Return an existing empty conversation, even if Bob has never opened it; preserve its timestamps.
                  value:
                    type: create_conversation
                    data:
                      id: alice@example.com::bob@example.com
                      org_id: acme
                      participants:
                        - {type: carbon, id: alice@example.com}
                        - {type: carbon, id: bob@example.com}
                      last_message: null
                      last_message_status: null
                      created_at: '2026-09-16T08:00:00Z'
                      updated_at: '2026-09-16T08:00:00Z'
        '401':
          description: Missing, invalid, or expired authentication; authenticate again.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                type: error
                data:
                  error: {code: unauthorized, message: authentication required}
        '403':
          description: Authenticated caller lacks authority or the organization does not match; no conversation is created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                type: error
                data:
                  error: {code: forbidden, message: operation is not permitted}
        '409':
          description: Conflicting idempotency-key reuse or an in-progress retry. Correct the request/key, or retry the identical pending request later.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                reused_key:
                  value:
                    type: error
                    data:
                      error: {code: conflict, message: idempotency key was already used with different request content}
                in_progress:
                  value:
                    type: error
                    data:
                      error: {code: conflict, message: idempotent request is still in progress}
        '422':
          description: Invalid input/required headers, or any requested member is unknown, inactive, outside this organization, or not yet disclosed to
            DM. No partial conversation is created. This does not prove an account does not exist in IAM.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                unverified_member:
                  summary: A requested member has no verifiable active organization membership in DM.
                  value:
                    type: error
                    data:
                      error: {code: validation_error, message: IAM has not supplied an active membership for this participant to DM; the recipient can sign
                          in to refresh their membership}
                empty_participants:
                  value:
                    type: error
                    data:
                      error: {code: validation_error, message: participant_ids must contain at least one member}
                only_self:
                  value:
                    type: error
                    data:
                      error: {code: validation_error, message: a conversation requires at least two unique participants}
                too_many_participants:
                  value:
                    type: error
                    data:
                      error: {code: validation_error, message: a conversation may contain at most 100 unique participants}
        '500':
          description: Internal failure; outcome may be uncertain. Retry with the same idempotency key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                type: error
                data:
                  error: {code: internal_error, message: internal server error}
        '503':
          description: IAM is unavailable; retry with the same idempotency key once available.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                type: error
                data:
                  error: {code: dependency_unavailable, message: dependency iam is unavailable}
      tags: [Conversations]
  /internal/honeycomb/organizations/{org_id}/testing-environments/{environment_id}/operations/{operation_id}:
    parameters:
      - name: org_id
        in: path
        required: true
        schema: {type: string}
      - name: environment_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: operation_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      tags: [Testing]
      operationId: applyHoneycombLifecycle
      summary: Apply a protected Honeycomb lifecycle instruction
      description: Plain coordinator JSON, without the public DM envelope. Retry the identical instruction and operation ID. Completion follows test database
        cleanup; failures remain fenced.
      security:
        - honeycombService: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HoneycombOperation'}
      responses:
        '200':
          description: Exact completed receipt or replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HoneycombReceipt'}
        '400': {description: Invalid instruction or path/body mismatch}
        '401': {description: Missing or invalid service credential}
        '409': {description: 'Stale revision, conflicting retry, or incompatible transition'}
        '500': {description: Failed operation; inspect receipt and retry identical instruction}
    get:
      tags: [Testing]
      operationId: getHoneycombLifecycleReceipt
      summary: Recover a pending, completed or failed lifecycle receipt
      security:
        - honeycombService: []
      responses:
        '200':
          description: Secret-free durable receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HoneycombReceipt'}
        '401': {description: Missing or invalid service credential}
        '404': {description: Unknown operation for the requested organization}
  /api/v1/groups:
    post:
      tags: [Groups]
      operationId: createGroup
      summary: Create a group as an organization administrator or owner
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/TestingKey'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '201':
          description: Successful group operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [type, data]
                properties:
                  type: {type: string, const: create_group}
                  data: {$ref: '#/components/schemas/Conversation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, data]
              properties:
                type: {type: string, const: create_group}
                data: {$ref: '#/components/schemas/GroupCreate'}
      description: Creator is invited automatically. Groups have stable conversation UUIDs and full prior message history for new members. Private groups
        admit invited members or members with any matching current IAM tag. Public groups automatically admit organization Carbons; Silicons always require
        an explicit invitation. Only org_admin/org_owner (and canonical IAM admin/owner aliases) may create, update, invite or remove invitations. Group
        administration does not itself grant history access.
  /api/v1/groups/{group_id}:
    get:
      tags: [Groups]
      operationId: getGroup
      summary: Read group settings, active participants and latest message
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/TestingKey'}
        - name: group_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ConversationAddress'}
      responses:
        '200':
          description: Successful group operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [type, data]
                properties:
                  type: {type: string, const: group}
                  data: {$ref: '#/components/schemas/Conversation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [Groups]
      operationId: updateGroup
      summary: Replace group settings with an exact current version
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/TestingKey'}
        - name: group_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ConversationAddress'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - name: If-Match
          in: header
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Successful group operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [type, data]
                properties:
                  type: {type: string, const: update_group}
                  data: {$ref: '#/components/schemas/GroupDetails'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, data]
              properties:
                type: {type: string, const: update_group}
                data: {$ref: '#/components/schemas/GroupSettings'}
  /api/v1/groups/{group_id}/members:
    post:
      tags: [Groups]
      operationId: inviteGroupMembers
      summary: Add explicit invitations as an organization administrator or owner
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/TestingKey'}
        - name: group_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ConversationAddress'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: Successful group operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [type, data]
                properties:
                  type: {type: string, const: invite_group_members}
                  data: {$ref: '#/components/schemas/GroupDetails'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, data]
              properties:
                type: {type: string, const: invite_group_members}
                data: {$ref: '#/components/schemas/GroupMembers'}
    delete:
      tags: [Groups]
      operationId: removeGroupMembers
      summary: Remove explicit invitations; tag and public grants remain independent
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/TestingKey'}
        - name: group_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ConversationAddress'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: Successful group operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [type, data]
                properties:
                  type: {type: string, const: remove_group_members}
                  data: {$ref: '#/components/schemas/GroupDetails'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, data]
              properties:
                type: {type: string, const: remove_group_members}
                data: {$ref: '#/components/schemas/GroupMembers'}
  /api/v1/contracts:
    get:
      tags: [Operations]
