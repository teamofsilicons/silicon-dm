  /api/v1/ws/shared:
    get:
      tags: [Delivery]
      operationId: retiredSharedSocket
      summary: Retired DM socket endpoint
      deprecated: true
      security: []
      description: Returns 410 delivery_moved_to_ting without upgrading, including for old protocol headers. Enroll through DM delivery registration, receive Ting updates, and recover through DM HTTP sync. This route no longer authenticates socket subscriptions.
      responses:
        '410':
          description: Delivery moved to Ting; use the returned discovery paths.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryRetirement'}
  /api/v1/reports:
    post:
      tags: [Operations]
      operationId: submitBugReport
      summary: Durably submit a report and queue a Postmark notification
      description: Production retries notification delivery. Sandbox email is simulated. Reuse Idempotency-Key after an uncertain response. Ten new reports
        per member per hour.
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/TestingKey'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, data]
              properties:
                type: {type: string, const: report}
                data:
                  type: object
                  additionalProperties: false
                  required: [message, client_version]
                  properties:
                    message: {type: string, minLength: 1, maxLength: 60000}
                    pr:
                      type: [string, 'null']
                      format: uri
                    client_version: {type: string, maxLength: 100}
      responses:
        '202':
          description: Durable acknowledgement; notification is queued, sent or simulated
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {type: string, const: report}
                  data:
                    type: object
                    required: [id, submitted, notification, repository]
                    properties:
                      id: {type: string, format: uuid}
                      submitted: {type: boolean}
                      notification:
                        type: string
                        enum: [queued, sent, simulated]
                      repository: {type: string, format: uri}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/telemetry:
    post:
      tags: [Operations]
      operationId: recordDiagnostic
      summary: Record a bounded diagnostic event without distributing the ingest key
      description: X-DM-Telemetry off disables collection. Sandbox diagnostics remain in their own schema. Message content, URLs and secrets are excluded
        from the accepted schema.
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/TestingKey'}
        - in: header
          name: X-DM-Telemetry
          schema:
            type: string
            enum: ['on', 'off']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, data]
              properties:
                type: {type: string, const: telemetry}
                data:
                  type: object
                  additionalProperties: false
                  required: [source, event, success, duration_ms]
                  properties:
                    source:
                      type: string
                      enum: [cli, sdk, daemon, web]
                    event:
                      type: string
                      enum: [command, connection, callback, queue, update, page_view, request, web_error]
                    success: {type: boolean}
                    duration_ms: {type: integer, minimum: 0, maximum: 604800000}
      responses:
        '204': {description: Diagnostic accepted or opted out}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
