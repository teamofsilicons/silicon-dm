      parameters:
        - {$ref: '#/components/parameters/TestingKey'}
      responses:
        '200':
          description: Contract versions and compatibility matrix for the selected plane
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {type: string, const: contracts}
                  data:
                    type: object
                    required: [service, service_version, contracts, compatibility, delivery, retired_routes]
                    properties:
                      service: {type: string, const: silicon-dm}
                      service_version: {type: string}
                      contracts: {type: array, items: {type: object, additionalProperties: true}}
                      compatibility:
                        type: array
                        items:
                          type: object
                          required: [http]
                          properties: {http: {type: integer, const: 3}}
