        default: {$ref: '#/components/responses/Error'}
  /api/v1/conversations/{conversation_id}/bundles/{bundle_id}:
    get:
      tags: [Bundles]
      operationId: getMessageBundle
      summary: Retrieve a bundle and its original messages
      description: Expanded message payloads are limited to 128 MiB in aggregate. One individually legal oversized message is allowed when all remaining
        message payloads total at most 16 MiB. Larger expansions return 413 response_too_large; retrieve originals individually by message ID.
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/ConversationId'}
