                        type: [integer, 'null']
                      testing_environment:
                        type: [object, 'null']
                        additionalProperties: true
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/ws:
    get:
